spring.application.name: continuum-cluster-manager
server:
  port: 8080
  max-http-header-size: 80KB
  error:
    include-message: always
    include-stacktrace: on_param
spring:
  datasource:
    url: ${CONTINUUM_DB_URL:jdbc:postgresql://localhost:35432/continuum}
    username: ${CONTINUUM_DB_USERNAME:continuum_owner}
    password: ${CONTINUUM_DB_PASSWORD:continuum-test-password}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always

continuum.core:
  cluster-manager:
    kubernetes:
      master-url: ${KUBERNETES_MASTER_URL:}
      kubeconfig: ${KUBECONFIG:}
    workbench:
      default-image: ${WORKBENCH_DEFAULT_IMAGE:projectcontinuum/continuum-workbench:0.0.5}
      namespace: ${WORKBENCH_NAMESPACE:default}
      image-repository: ${WORKBENCH_IMAGE_REPOSITORY:projectcontinuum/continuum-workbench}
      image-pull-policy: ${WORKBENCH_IMAGE_PULL_POLICY:IfNotPresent}
      # Comma-separated image repository prefixes create/update requests may use (defaults to image-repository).
      # Set to an empty value to allow any syntactically valid image reference.
      allowed-image-prefixes: ${WORKBENCH_ALLOWED_IMAGE_PREFIXES:${WORKBENCH_IMAGE_REPOSITORY:projectcontinuum/continuum-workbench}}
      overlays:
        enabled: ${OVERLAY_ENABLED:false}
        path: ${OVERLAY_PATH:./.data/overlays/workbench}

springdoc:
  packages-to-scan: org.projectcontinuum.core.cluster.manager.controller
  # OpenAPI spec (/v3/api-docs) and Swagger UI. On by default for local/dev; the Helm chart turns both off
  # (CONTINUUM_API_DOCS_ENABLED=false). Continuum has no auth layer of its own, so the docs are never gated by one.
  api-docs:
    enabled: ${CONTINUUM_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${CONTINUUM_API_DOCS_ENABLED:true}
    urls-primary-name: public
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  writer-with-order-by-keys: true
  # Every operation is documented explicitly; springdoc must not add the advice's responses to each one.
  override-with-generic-response: false

continuum.core.api-docs:
  # Adds the "internal" group (Traefik ForwardAuth /authorize) to /v3/api-docs/internal. Needs the docs enabled.
  internal-group-enabled: ${CONTINUUM_API_DOCS_INTERNAL_ENABLED:false}
  # Fixed absolute server URL for the spec. Empty: derived from the request, including X-Forwarded-Prefix.
  server-url: ${CONTINUUM_API_DOCS_SERVER_URL:}
