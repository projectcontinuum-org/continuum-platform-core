spring.application.name: continuum-api-server
spring:
  datasource:
    url: ${CONTINUUM_DB_URL:jdbc:postgresql://localhost:35432/continuum}
    username: ${CONTINUUM_DB_USERNAME:continuum_owner}
    password: ${CONTINUUM_DB_PASSWORD:continuum-test-password}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  # Spring cache (Caffeine). REGISTERED_NODES: node registry rows by node id (NodeTreeEntryRepository.findByNodeId),
  # used by property validation, node docs and the MCP tools. Keep expireAfterWrite short: it is how long a
  # re-registered node can lag behind (the message-bridge writes the registry, so nothing evicts here).
  cache:
    type: caffeine
    cache-names: REGISTERED_NODES
    caffeine:
      spec: ${CONTINUUM_NODE_REGISTRY_CACHE_SPEC:maximumSize=10000,expireAfterWrite=30s}
temporal:
  connection:
    target: ${TEMPORAL_SERVER_ADDRESS:localhost:7233}
    namespace: ${TEMPORAL_NAMESPACE:default}
spring.ai.mcp.server:
  name: continuum-node-registry-mcp-server
  version: 1.0.0
  type: SYNC
  protocol: STREAMABLE
  annotation-scanner:
    enabled: true
continuum.core:
  api-server:
    cache-directory-base-path: ${CONTINUUM_CACHE_DIRECTORY:./.continuum-cache/workflow-data}
    # Operator endpoints under /api/v1/admin require the caller to be in one of these groups: a comma-separated list,
    # matched against the comma-separated x-continuum-user-groups header (set by the ingress/auth layer, never by the
    # client). Empty (the default) disables them: they answer 404.
    admin:
      groups: ${CONTINUUM_ADMIN_GROUPS:}
    storage:
      type: ${CONTINUUM_STORAGE_TYPE:minio}
      bucket-name: ${CONTINUUM_CACHE_BUCKET_NAME:continuum-worker-storage}
      bucket-region: ${CONTINUUM_CACHE_BUCKET_REGION:us-east-2}
      bucket-base-path: ${CONTINUUM_CACHE_BUCKET_BASE_PATH:workflow-data}
      minio:
        endpoint: ${CONTINUUM_MINIO_ENDPOINT:http://localhost:39000}
        access-key: ${CONTINUUM_MINIO_USERNAME:minioadmin}
        secret-key: ${CONTINUUM_MINIO_PASSWORD:minioadmin}

springdoc:
  # OpenAPI spec (/v3/api-docs) and Swagger UI. On by default for local/dev; the Helm chart turns both off
  # (CONTINUUM_API_DOCS_ENABLED=false). Continuum has no auth layer of its own, so the docs are never gated by one.
  api-docs:
    enabled: ${CONTINUUM_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${CONTINUUM_API_DOCS_ENABLED:true}
    urls-primary-name: public
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  writer-with-order-by-keys: true
  # Every operation is documented explicitly; springdoc must not add a generic 200 or the advice's responses.
  override-with-generic-response: false

server:
  # Honour X-Forwarded-Prefix/Host/Proto from the proxy (Traefik stripPrefix /api-server, nginx), so Swagger UI
  # redirects and the generated server URL keep the external prefix.
  forward-headers-strategy: framework

continuum.core.api-docs:
  # Adds the "internal" group (admin endpoints) to /v3/api-docs/internal and Swagger UI. Needs the docs enabled.
  internal-group-enabled: ${CONTINUUM_API_DOCS_INTERNAL_ENABLED:false}
  # Fixed absolute server URL for the spec (e.g. https://continuum.example.com/api-server). Empty: derived from
  # the request, including X-Forwarded-Prefix.
  server-url: ${CONTINUUM_API_DOCS_SERVER_URL:}
