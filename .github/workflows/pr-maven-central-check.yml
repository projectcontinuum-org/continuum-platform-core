name: Maven Central Version Check

# Warns (never fails) when platformVersion is already on Maven Central. A PR does not have to bump the version:
# that happens at release time, and the release workflow runs the same script in fail mode before it publishes.
# Every continuum-* module shares platformVersion (gradle.properties).
on:
  pull_request:
    paths:
      - 'continuum-*/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle/**'
      - '.github/scripts/check-maven-central.js'
      - '.github/workflows/pr-maven-central-check.yml'

concurrency:
  group: maven-central-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Maven artifacts not yet published
    runs-on: ubuntu-latest
    steps:
      # LFS: every checkout that builds modules fetches the bundled binaries (DuckDB extensions), not pointer files.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Stages the exact POMs a release would upload, for every module that publishes (no signing, no credentials).
      - name: Stage artifacts locally
        run: |
          chmod +x ./gradlew
          ./gradlew publishAllPublicationsToLocalStagingRepository --no-daemon --stacktrace

      # Secrets are absent on fork/Dependabot PRs; the script then checks repo1.maven.org only.
      - name: Check artifacts are not already on Maven Central
        uses: actions/github-script@v7
        with:
          script: await require('./.github/scripts/check-maven-central.js')({core, glob})
        env:
          MAVEN_CENTRAL_CHECK_MODE: warn
          MAVEN_REPO_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_REPO_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
