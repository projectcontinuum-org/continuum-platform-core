  /api/v1/workflow/count:
    get:
      description: |2-

        Counts the caller's Temporal executions, optionally narrowed by a visibility query. A trailing
        `GROUP BY ExecutionStatus` also returns one count per status in `groups`. Read-only.
      operationId: countWorkflowExecutions
      parameters:
      - description: "Optional Temporal visibility filter (e.g. `ExecutionStatus =\
          \ 'Running'`). It is AND-combined with the caller's own runs, so it can\
          \ only narrow the result. Rejected (400) with unbalanced parentheses, unterminated\
          \ quotes, `;`, comments (`--`, `/*`, `#`), backslashes or control characters.\
          \ May end with `GROUP BY ExecutionStatus`."
        example: WorkflowType = 'IContinuumWorkflow' GROUP BY ExecutionStatus
        in: query
        name: query
        required: false
        schema:
          type: string
          default: ""
      responses:
        "200":
          content:
            application/json:
              example:
                count: 12
                groups:
                - name: '"Completed"'
                  count: 9
                - name: '"Running"'
                  count: 3
              schema:
                $ref: "#/components/schemas/WorkflowExecutionCount"
          description: The count.
        "400":
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Bad Request
                status: 400
                detail: "Invalid visibility query: unbalanced parentheses"
                instance: /api/v1/workflow/list
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The `query` could escape the caller's filter, or Temporal\
            \ rejected it (e.g. an unknown search attribute)."
        "500":
          content:
            application/problem+json:
              examples:
                error:
                  value:
                    detail: Internal server error
                    instance: /api/v1/workflow/tree
                    status: 500
                    title: Internal Server Error
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Unexpected server error, or a dependency (PostgreSQL, Temporal,\
            \ S3) failed."
      security:
      - continuumUserId: []
      summary: Count the caller's workflow executions in Temporal
      tags:
      - Workflows
