      properties:
        errors:
          type: array
          description: Every error found. Any error rejects the workflow.
          items:
            $ref: "#/components/schemas/WorkflowIssue"
        warnings:
          type: array
          description: "Findings that would not block a start, e.g. an input port\
            \ with no incoming edge."
          items:
            $ref: "#/components/schemas/WorkflowIssue"
      required:
      - errors
      - warnings
    WorkflowValidationResponse:
      type: object
      description: Verdict of the start checks on a workflow.
      properties:
        edgeCount:
          type: integer
          format: int32
          description: Number of edges in the workflow.
          example: 1
        errors:
          type: array
          description: Problems that would reject a start.
          items:
            $ref: "#/components/schemas/WorkflowIssue"
        nodeCount:
          type: integer
          format: int32
          description: Number of nodes in the workflow.
          example: 2
        valid:
          type: boolean
          description: True when a start would be accepted (no errors).
          example: false
        warnings:
          type: array
          description: Findings that would not block a start.
          items:
            $ref: "#/components/schemas/WorkflowIssue"
      required:
      - edgeCount
      - errors
      - nodeCount
      - valid
      - warnings
  securitySchemes:
    continuumUserId:
      description: "Caller identity (owner of runs and schedules). Continuum has no\
