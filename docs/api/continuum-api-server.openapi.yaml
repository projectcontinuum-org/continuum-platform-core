        itemInfo:
          oneOf:
          - $ref: "#/components/schemas/WorkflowTreeExecution"
          - type: "null"
        name:
          type: string
          description: "Folder name, or the execution's start time (`java.util.Date#toString`)\
            \ for an execution."
          example: examples
      required:
      - id
      - name
    WorkflowValidationProblem:
      type: object
      allOf:
      - $ref: "#/components/schemas/ProblemDetail"
