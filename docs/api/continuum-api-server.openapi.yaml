openapi: 3.1.0
info:
  contact:
    name: Project Continuum
    url: https://github.com/projectcontinuum-org/continuum-platform-core
  description: |-
    REST API of the Continuum workflow platform. It starts, schedules, stops and inspects runs of workflows
    authored in the Continuum workbench (`.cwf` files), serves the node registry (the palette of nodes that
    feature workers registered) and pages through node output tables stored as Parquet in S3/MinIO.

    Runs execute as Temporal workflows (`continuum-orchestration-service`) whose nodes run on feature workers.
    Live run status is not polled here: it streams over MQTT on `continuum/workflow/execution/{workflowId}/update`
    and is mirrored into the run endpoints of this API.

    **Identity.** Continuum has no built-in authentication. The caller is the `x-continuum-user-id` header,
    set by the trusted reverse proxy in front of the platform; every user-scoped endpoint only sees the
    caller's own runs and schedules. Without the header the caller is `anonymous` (local development).

    **Errors** are RFC 9457 problem details (`application/problem+json`).

    The same server also exposes the node registry to AI agents as an MCP server at `/mcp` (not described here).
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  title: Continuum API Server
  version: 0.0.23
externalDocs:
  description: Continuum documentation
  url: https://docs.projectcontinuum.org
servers:
- description: Continuum API Server
  url: /
tags:
- description: "Start, validate, stop and query workflow runs through Temporal."
  name: Workflows
- description: "Run history from the database: one row per run, kept up to date by\
    \ the message bridge from the run's events."
  name: Workflow runs
- description: Cron schedules (Temporal schedules) that start a workflow repeatedly.
  name: Workflow schedules
- description: Paged reads of node output tables (Parquet in S3/MinIO).
  name: Node outputs
- description: "The node registry: nodes that feature workers registered, their documentation\
    \ and task queues. Not user-scoped."
  name: Node explorer
paths:
  /api/v1/data/{runId}/nodes/{nodeId}/outputs/{outputId}:
    get:
      description: |2-

        Returns one page of rows of a table a node produced, for previews in the workbench. The ids come from the output's
        location in the run (`{remote}<runId>/<nodeId>/output.<outputId>.parquet`, see `data.nodeToOutputMap` of
        `GET /api/v1/workflow-runs/{workflowId}`).

        The caller must own the run. On first access the Parquet file is downloaded from object storage into the server's
        cache; the page is then read from it. Read-only.
      operationId: getNodeOutputPage
      parameters:
      - description: "Temporal **run id** of the run (`runId` of `GET /api/v1/workflow-runs/{workflowId}`,\
          \ the first segment of the output location), not the workflow id. Must match\
          \ `^[A-Za-z0-9._-]{1,255}$`, must not be `.` and must not contain `..`."
        example: 0b7c6f0a-2a55-4f43-9a36-0c8f4d2b1e77
        in: path
        name: runId
        required: true
        schema:
          type: string
      - description: "Id of the node in the workflow. Must match `^[A-Za-z0-9._-]{1,255}$`,\
          \ must not be `.` and must not contain `..`."
        example: normalize
        in: path
        name: nodeId
        required: true
        schema:
          type: string
      - description: "Output port id of the node. Must match `^[A-Za-z0-9._-]{1,255}$`,\
          \ must not be `.` and must not contain `..`."
        example: data
        in: path
        name: outputId
        required: true
        schema:
          type: string
      - description: Zero-based page number.
        example: 0
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - description: Rows per page.
        example: 10
        in: query
        name: pageSize
        required: false
        schema:
          type: integer
          format: int32
          default: 10
          maximum: 1000
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                - - name: clean_name
                    value: YWxpY2U=
                    contentType: text/plain
                - - name: clean_name
                    value: Ym9i
                    contentType: text/plain
                currentPage: 0
                currentPageSize: 10
                totalPages: 1
                totalElements: 2
                hasNext: false
                hasPrevious: false
              schema:
                $ref: "#/components/schemas/NodeOutputPage"
          description: One page of rows.
        "400":
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Bad Request
                status: 400
                detail: "Invalid pageSize: must be between 1 and 1000"
                instance: /api/v1/data/0b7c6f0a-2a55-4f43-9a36-0c8f4d2b1e77/nodes/normalize/outputs/data
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An id is not allowed, `page` is negative or `pageSize` is\
            \ outside 1..1000."
        "404":
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: Workflow run not found
                instance: /api/v1/data/0b7c6f0a-2a55-4f43-9a36-0c8f4d2b1e77/nodes/normalize/outputs/data
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No run with this run id is owned by the caller (unknown and\
            \ other tenants' runs are indistinguishable), or the run has no stored\
            \ output for this node and port."
        "500":
          content:
            application/problem+json:
              examples:
                error:
                  value:
                    detail: Internal server error
                    instance: /api/v1/workflow/tree
                    status: 500
                    title: Internal Server Error
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Unexpected server error, or a dependency (PostgreSQL, Temporal,\
            \ S3) failed."
      security:
      - continuumUserId: []
      summary: Read one page of a node output table
      tags:
      - Node outputs
  /api/v1/node-explorer/children:
    get:
      description: |2-

        Returns the categories and nodes directly under a category of the node palette: categories first (`type: CATEGORY`,
        `id` = category path to pass as `parentId`), then nodes (`type: NODE`, `id` = node id, `nodeInfo` = the registered
        definition). The workbench's node explorer loads the palette lazily with this. An unknown category is an empty list.
        Not user-scoped: every caller sees the same registry. Read-only.
      operationId: listNodeExplorerChildren
      parameters:
      - description: "Category path (`/`-separated, as returned in `id`); empty for\
          \ the root."
        example: Table & Data Structures
        in: query
        name: parentId
        required: false
        schema:
          type: string
          default: ""
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NodeExplorerItem"
          description: "Categories, then nodes."
        "400":
          content:
            application/problem+json:
              examples:
                error:
                  value:
                    detail: Required request parameter 'baseDir' for method parameter
                      type String is not present
                    instance: /api/v1/workflow/tree
                    status: 400
                    title: Bad Request
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Malformed request: a missing or unparsable parameter, or a\
            \ body that is not valid JSON for this operation."
        "500":
          content:
            application/problem+json:
              examples:
                error:
                  value:
                    detail: Internal server error
                    instance: /api/v1/workflow/tree
                    status: 500
                    title: Internal Server Error
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Unexpected server error, or a dependency (PostgreSQL, Temporal,\
            \ S3) failed."
      summary: List one level of the node palette
      tags:
      - Node explorer
  /api/v1/node-explorer/nodes/documentation:
    get:
      description: |2-

        Same as `GET /api/v1/node-explorer/nodes/{nodeId}/documentation`, for node ids that a proxy might alter in a path.
        Not user-scoped: every caller sees the same registry. Read-only.
      operationId: getNodeDocumentationByQuery
      parameters:
      - description: Node id (fully qualified class name of the node model).
        example: org.projectcontinuum.feature.base.analytics.node.TextNormalizerNodeModel
        in: query
        name: nodeId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            text/markdown:
              example: |-
                # Text Normalizer

                Trims, lowercases and removes non-alphanumeric characters from `inputCol` into `outputCol`.
              schema:
                type: string
          description: The documentation.
        "400":
          content:
            application/problem+json:
              examples:
                error:
                  value:
                    detail: Required request parameter 'baseDir' for method parameter
                      type String is not present
                    instance: /api/v1/workflow/tree
                    status: 400
                    title: Bad Request
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Malformed request: a missing or unparsable parameter, or a\
            \ body that is not valid JSON for this operation."
        "404":
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: No documentation for this node
                instance: /api/v1/node-explorer/nodes/org.example.UnknownNodeModel/documentation
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The node is not registered, or has no documentation."
        "500":
          content:
            application/problem+json:
              examples:
                error:
                  value:
                    detail: Internal server error
                    instance: /api/v1/workflow/tree
                    status: 500
                    title: Internal Server Error
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Unexpected server error, or a dependency (PostgreSQL, Temporal,\
            \ S3) failed."
      summary: Get a node's documentation (node id as a query parameter)
      tags:
      - Node explorer
  /api/v1/node-explorer/nodes/task-queues:
    post:
      description: |2-

        Maps each node id to the Temporal task queue of the feature worker that registered it. The orchestration service calls
        this before dispatching a run's nodes; a node id that is not registered is absent from the result (the orchestrator
        retries until its worker registers). Not user-scoped: every caller sees the same registry. Read-only and idempotent.
      operationId: resolveNodeTaskQueues
      requestBody:
        content:
          application/json:
            example:
            - org.projectcontinuum.feature.base.analytics.node.CreateTableNodeModel
            - org.projectcontinuum.feature.base.analytics.node.TextNormalizerNodeModel
            schema:
              type: array
              items:
                type: string
        description: Node ids to resolve.
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                org.projectcontinuum.feature.base.analytics.node.CreateTableNodeModel: continuum-feature-base
                org.projectcontinuum.feature.base.analytics.node.TextNormalizerNodeModel: continuum-feature-base
              schema:
                type: object
                additionalProperties:
                  type: string
          description: "Node id → task queue, for the registered ids only."
        "400":
          content:
            application/problem+json:
              examples:
                error:
                  value:
                    detail: Required request parameter 'baseDir' for method parameter
                      type String is not present
                    instance: /api/v1/workflow/tree
                    status: 400
                    title: Bad Request
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Malformed request: a missing or unparsable parameter, or a\
            \ body that is not valid JSON for this operation."
        "500":
          content:
            application/problem+json:
              examples:
                error:
                  value:
                    detail: Internal server error
                    instance: /api/v1/workflow/tree
                    status: 500
                    title: Internal Server Error
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Unexpected server error, or a dependency (PostgreSQL, Temporal,\
            \ S3) failed."
      summary: Resolve node ids to the task queues of their workers
      tags:
      - Node explorer
  /api/v1/node-explorer/nodes/{nodeId}/documentation:
    get:
      description: |2-

        Returns the Markdown documentation the node's worker registered. Cached for a short time (30 s by default), so a
        re-registered node's documentation can lag that long. Not user-scoped: every caller sees the same registry. Read-only.
      operationId: getNodeDocumentation
      parameters:
      - description: Node id (fully qualified class name of the node model).
        example: org.projectcontinuum.feature.base.analytics.node.TextNormalizerNodeModel
        in: path
        name: nodeId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            text/markdown:
              example: |-
                # Text Normalizer

                Trims, lowercases and removes non-alphanumeric characters from `inputCol` into `outputCol`.
              schema:
                type: string
          description: The documentation.
        "400":
          content:
            application/problem+json:
              examples:
                error:
                  value:
                    detail: Required request parameter 'baseDir' for method parameter
                      type String is not present
                    instance: /api/v1/workflow/tree
                    status: 400
                    title: Bad Request
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Malformed request: a missing or unparsable parameter, or a\
            \ body that is not valid JSON for this operation."
        "404":
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: No documentation for this node
                instance: /api/v1/node-explorer/nodes/org.example.UnknownNodeModel/documentation
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The node is not registered, or has no documentation."
        "500":
          content:
            application/problem+json:
              examples:
                error:
                  value:
                    detail: Internal server error
                    instance: /api/v1/workflow/tree
                    status: 500
                    title: Internal Server Error
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Unexpected server error, or a dependency (PostgreSQL, Temporal,\
            \ S3) failed."
      summary: Get a node's documentation
      tags:
      - Node explorer
  /api/v1/node-explorer/search:
    get:
      description: |2-

        Finds registered nodes whose name, description, documentation or node id contains `query` (case-insensitive), and
        returns them inside their category path (each category has `children`). A blank query returns an empty list.
        Not user-scoped: every caller sees the same registry. Read-only.
      operationId: searchNodes
      parameters:
      - description: "Text to look for. `%` and `_` match any characters (SQL LIKE\
          \ wildcards; TODO: probably unintended)."
        example: normalize
        in: query
        name: query
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NodeExplorerItem"
          description: Matches grouped under their categories.
        "400":
          content:
            application/problem+json:
              examples:
                error:
                  value:
                    detail: Required request parameter 'baseDir' for method parameter
                      type String is not present
                    instance: /api/v1/workflow/tree
                    status: 400
                    title: Bad Request
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Malformed request: a missing or unparsable parameter, or a\
            \ body that is not valid JSON for this operation."
        "500":
          content:
            application/problem+json:
              examples:
                error:
                  value:
                    detail: Internal server error
                    instance: /api/v1/workflow/tree
                    status: 500
                    title: Internal Server Error
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Unexpected server error, or a dependency (PostgreSQL, Temporal,\
            \ S3) failed."
      summary: Search registered nodes
      tags:
      - Node explorer
  /api/v1/workflow:
    post:
      description: |2-

        Starts one run of a complete workflow (the content of a `.cwf` file), owned by the caller. The workbench calls this
        when the user runs the open workflow.

        The workflow is first checked exactly like `POST /api/v1/workflow/validate`: unique node ids, every `data.nodeModel`
        registered, edge endpoints and ports, no self or duplicate edges, one edge per input port, no cycles, and every node's
        `properties` against the **registered** properties schema (the `propertiesSchema`, `inputs` and `outputs` in the body
        are ignored), and the workflow `name` must be a valid URI path (it becomes the run's `workflowUri`). An invalid workflow is rejected with every problem listed, and nothing is stored or started. A node type
        whose worker has not registered yet is an error: retry once the worker is up.

        On success the run is recorded (`PENDING`) and a Temporal workflow is started; the response returns its workflow id.
        Status then streams over MQTT (`continuum/workflow/execution/{workflowId}/update`) and is mirrored into
        `GET /api/v1/workflow-runs/{workflowId}`. Not idempotent: every call starts a new run.
      operationId: startWorkflow
      requestBody:
        content:
          application/json:
            examples:
              twoNodes:
                description: twoNodes
                summary: Create Table → Text Normalizer
                value:
                  id: a3f1c9e2b7d84f60a1c2e3d4f5a6b7c8d9e0f1a2b3c4d5e6f708192a3b4c5d6e
                  name: examples/text-cleanup.cwf
                  active: false
                  nodes:
                  - id: create
                    type: BaseNode
                    position:
                      x: 0
                      "y": 0
                    width: 250
                    height: 120
                    selected: false
                    data:
                      id: org.projectcontinuum.feature.base.analytics.node.CreateTableNodeModel
                      title: Create Table
                      description: Creates a structured table from FreeMarker template
                        configuration
                      nodeModel: org.projectcontinuum.feature.base.analytics.node.CreateTableNodeModel
                      outputs:
                        data:
                          name: output table
                          contentType: text/plain
                      properties:
                        jsonArrayString: "[{\"name\": \"  Alice \"}, {\"name\": \"\
                          BOB!\"}]"
                  - id: normalize
                    type: BaseNode
                    position:
                      x: 330
                      "y": 0
                    width: 250
                    height: 120
                    selected: false
                    data:
                      id: org.projectcontinuum.feature.base.analytics.node.TextNormalizerNodeModel
                      title: Text Normalizer
                      description: "Normalizes text by trimming, lowercasing, and\
                        \ removing non-alphanumeric characters"
                      nodeModel: org.projectcontinuum.feature.base.analytics.node.TextNormalizerNodeModel
                      inputs:
                        data:
                          name: input table
                          contentType: text/plain
                      outputs:
                        data:
                          name: output table
                          contentType: text/plain
                      properties:
                        inputCol: name
                        outputCol: clean_name
                  edges:
                  - id: reactflow__edge-createdata-normalizedata
                    type: BaseEdge
                    source: create
                    sourceHandle: data
                    target: normalize
                    targetHandle: data
            schema:
              $ref: "#/components/schemas/ContinuumWorkflowModel"
        description: The workflow to run.
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                workflowId: 6b1f0e4e-8f4a-4d8c-9d61-3c2b7f1a9e10
                warnings: []
              schema:
                $ref: "#/components/schemas/StartWorkflowResponse"
          description: Run started. `warnings` lists findings that did not block it.
        "400":
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Invalid workflow
                status: 400
                detail: "Invalid workflow: 1 error(s). Node 'normalize' (org.projectcontinuum.feature.base.analytics.node.TextNormalizerNodeModel):\
                  \ property 'outputCol' is required."
                instance: /api/v1/workflow
                errors:
                - message: "Node 'normalize' (org.projectcontinuum.feature.base.analytics.node.TextNormalizerNodeModel):\
                    \ property 'outputCol' is required."
                  node: normalize
                  property: outputCol
                warnings: []
              schema:
                $ref: "#/components/schemas/WorkflowValidationProblem"
          description: "The workflow is invalid (`errors` lists every problem), or\
            \ the body is malformed."
        "500":
          content:
            application/problem+json:
              examples:
                error:
                  value:
                    detail: Internal server error
                    instance: /api/v1/workflow/tree
                    status: 500
                    title: Internal Server Error
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Unexpected server error, or a dependency (PostgreSQL, Temporal,\
            \ S3) failed."
      security:
      - continuumUserId: []
      summary: Start a workflow run
      tags:
      - Workflows
  /api/v1/workflow-runs:
    get:
      description: |2-

        Pages through the caller's runs from the database, newest first, without their snapshot and outputs (use
        `GET /api/v1/workflow-runs/{workflowId}` for one run in full). Used by the workbench's run history.

        The page is Spring Data's `PagedModel`: `content` plus `page.size`, `page.number`, `page.totalElements` and
        `page.totalPages`. Read-only.
      operationId: listWorkflowRuns
      parameters:
      - description: "RSQL filter over the run fields `workflowId`, `workflowUri`,\
          \ `status`, `scheduleId`, `progressPercentage`, `createdAt` and `updatedAt`\
          \ (`;` = and, `,` = or; dates ISO-8601). Always narrowed to the caller's\
          \ own runs."
        example: workflowUri=="examples/text-cleanup.cwf";updatedAt>=2026-11-01T00:00:00Z
        in: query
        name: filter
        required: false
        schema:
          type: string
      - description: Zero-based page number.
        example: 0
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - description: Page size (runs per page).
        example: 20
        in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          minimum: 1
      - description: "Additional RSQL sort (`field,asc|desc`, `;`-separated) applied\
          \ on top of the default `createdAt` descending order."
        example: "status,asc"
        in: query
        name: sort
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedModelWorkflowRunSummary"
          description: One page of run summaries.
        "400":
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Invalid filter
                status: 400
                detail: "Invalid filter: it names a field that cannot be filtered\
                  \ on"
                instance: /api/v1/workflow-runs
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The `filter` is not valid RSQL, names a field that cannot\
            \ be filtered on, or has a value of the wrong type."
        "500":
          content:
            application/problem+json:
              examples:
                error:
                  value:
                    detail: Internal server error
                    instance: /api/v1/workflow/tree
                    status: 500
                    title: Internal Server Error
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Unexpected server error, or a dependency (PostgreSQL, Temporal,\
            \ S3) failed."
      security:
      - continuumUserId: []
      summary: "List the caller's workflow runs, newest first"
      tags:
      - Workflow runs
  /api/v1/workflow-runs/count:
    get:
      description: Counts the caller's runs in the database that match the optional
        RSQL `filter`. Read-only.
      operationId: countWorkflowRuns
      parameters:
      - description: "RSQL filter over the run fields `workflowId`, `workflowUri`,\
          \ `status`, `scheduleId`, `progressPercentage`, `createdAt` and `updatedAt`\
          \ (`;` = and, `,` = or; dates ISO-8601). Always narrowed to the caller's\
          \ own runs."
        example: status==FAILED
        in: query
        name: filter
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRunCount"
          description: The count.
        "400":
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Invalid filter
                status: 400
                detail: "Invalid filter: it names a field that cannot be filtered\
                  \ on"
                instance: /api/v1/workflow-runs
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The `filter` is not valid RSQL, names a field that cannot\
            \ be filtered on, or has a value of the wrong type."
        "500":
          content:
            application/problem+json:
              examples:
                error:
                  value:
                    detail: Internal server error
                    instance: /api/v1/workflow/tree
                    status: 500
                    title: Internal Server Error
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Unexpected server error, or a dependency (PostgreSQL, Temporal,\
            \ S3) failed."
      security:
      - continuumUserId: []
      summary: Count the caller's workflow runs
      tags:
      - Workflow runs
  /api/v1/workflow-runs/distinct-workflows:
    get:
      description: |2-

        Pages through the distinct `workflowUri` values (workflow file paths) of the caller's runs, sorted alphabetically. The
        workbench builds the first level of its run history tree from this. With a `filter` the distinct set is computed over
        every matching run. Read-only.
      operationId: listRunWorkflowUris
      parameters:
      - description: "RSQL filter over the run fields `workflowId`, `workflowUri`,\
          \ `status`, `scheduleId`, `progressPercentage`, `createdAt` and `updatedAt`\
          \ (`;` = and, `,` = or; dates ISO-8601). Always narrowed to the caller's\
          \ own runs."
        example: updatedAt>=2026-11-01T00:00:00Z
        in: query
        name: filter
        required: false
        schema:
          type: string
      - description: Zero-based page number.
        example: 0
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - description: Page size.
        example: 50
        in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedModelString"
          description: One page of workflow URIs.
        "400":
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Invalid filter
                status: 400
                detail: "Invalid filter: it names a field that cannot be filtered\
                  \ on"
                instance: /api/v1/workflow-runs
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The `filter` is not valid RSQL, names a field that cannot\
            \ be filtered on, or has a value of the wrong type."
        "500":
          content:
            application/problem+json:
              examples:
                error:
                  value:
                    detail: Internal server error
                    instance: /api/v1/workflow/tree
                    status: 500
                    title: Internal Server Error
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Unexpected server error, or a dependency (PostgreSQL, Temporal,\
            \ S3) failed."
      security:
      - continuumUserId: []
      summary: List the distinct workflow files the caller has runs of
      tags:
      - Workflow runs
