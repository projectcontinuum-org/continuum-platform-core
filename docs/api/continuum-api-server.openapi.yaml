          content:
            application/problem+json:
              examples:
                error:
                  value:
                    detail: Internal server error
                    instance: /api/v1/workflow/tree
                    status: 500
                    title: Internal Server Error
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Unexpected server error, or a dependency (PostgreSQL, Temporal,\
            \ S3) failed."
      security:
      - continuumUserId: []
      summary: Run a schedule's workflow now
      tags:
      - Workflow schedules
  /api/v1/workflow/schedule/{scheduleId}/unpause:
    post:
      description: Lets the schedule fire again from its next cron match (missed fires
        are not caught up). Idempotent.
      operationId: unpauseWorkflowSchedule
      parameters:
      - description: Schedule id (UUID) returned when the schedule was created.
        example: 1d0f3c52-7a3b-4c8e-9d4f-2b6a8e1f0c3d
        in: path
        name: scheduleId
        required: true
        schema:
          type: string
          format: uuid
      - description: Note stored with the unpause in Temporal.
        example: Migration done
        in: query
        name: note
        required: false
        schema:
          type: string
      responses:
        "204":
          description: Unpaused.
        "400":
          content:
            application/problem+json:
              examples:
                error:
                  value:
                    detail: Required request parameter 'baseDir' for method parameter
                      type String is not present
                    instance: /api/v1/workflow/tree
                    status: 400
                    title: Bad Request
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Malformed request: a missing or unparsable parameter, or a\
            \ body that is not valid JSON for this operation."
        "404":
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: Schedule not found
                instance: /api/v1/workflow/schedule/1d0f3c52-7a3b-4c8e-9d4f-2b6a8e1f0c3d
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No schedule with this id is owned by the caller.
        "500":
          content:
            application/problem+json:
              examples:
                error:
                  value:
                    detail: Internal server error
                    instance: /api/v1/workflow/tree
                    status: 500
                    title: Internal Server Error
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Unexpected server error, or a dependency (PostgreSQL, Temporal,\
            \ S3) failed."
      security:
      - continuumUserId: []
      summary: Resume a paused schedule
      tags:
      - Workflow schedules
  /api/v1/workflow/tree:
    get:
      description: |2-

        Builds a folder tree from the workflow names (paths) of the caller's executions below `baseDir`; each leaf is one
        execution with its submitted workflow and its outputs, rebuilt from the Temporal history. Newest first, at most 100
        per folder. Expensive: it reads the full history of every listed execution. Read-only.
      operationId: getWorkflowExecutionTree
      parameters:
      - description: Path prefix removed from every workflow name before it is split
          into folders.
        example: /home/continuum/workspace
        in: query
        name: baseDir
        required: true
        schema:
          type: string
      - description: "Optional Temporal visibility filter (e.g. `ExecutionStatus =\
          \ 'Running'`). It is AND-combined with the caller's own runs, so it can\
          \ only narrow the result. Rejected (400) with unbalanced parentheses, unterminated\
          \ quotes, `;`, comments (`--`, `/*`, `#`), backslashes or control characters."
        example: ExecutionStatus = 'Completed'
        in: query
        name: query
        required: false
        schema:
          type: string
          default: ""
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowTreeItem"
          description: The tree roots.
        "400":
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Bad Request
                status: 400
                detail: "Invalid visibility query: unbalanced parentheses"
                instance: /api/v1/workflow/list
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "`baseDir` is missing, or the `query` could escape the caller's\
            \ filter or was rejected by Temporal."
        "500":
          content:
            application/problem+json:
              examples:
                error:
                  value:
                    detail: Internal server error
                    instance: /api/v1/workflow/tree
                    status: 500
                    title: Internal Server Error
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Unexpected server error, or a dependency (PostgreSQL, Temporal,\
            \ S3) failed."
      security:
      - continuumUserId: []
      summary: Get the caller's executions grouped by workflow path
      tags:
      - Workflows
  /api/v1/workflow/validate:
    post:
      description: |2-

        Runs exactly the checks of `POST /api/v1/workflow` against the live node registry and returns the verdict, without
        storing or starting anything. Meant for editors and AI agents that want every error and warning while the workflow is
        still being written.

        An invalid workflow is a normal **200** with `valid: false`, so it can be told apart from a malformed body (400).
        Read-only and idempotent (the result follows the registry, which changes when workers register).
      operationId: validateWorkflow
      requestBody:
        content:
          application/json:
            examples:
              twoNodes:
                description: twoNodes
                summary: Create Table → Text Normalizer
                value:
                  id: a3f1c9e2b7d84f60a1c2e3d4f5a6b7c8d9e0f1a2b3c4d5e6f708192a3b4c5d6e
                  name: examples/text-cleanup.cwf
                  active: false
                  nodes:
                  - id: create
                    type: BaseNode
                    position:
                      x: 0
                      "y": 0
                    width: 250
                    height: 120
                    selected: false
                    data:
                      id: org.projectcontinuum.feature.base.analytics.node.CreateTableNodeModel
                      title: Create Table
                      description: Creates a structured table from FreeMarker template
                        configuration
                      nodeModel: org.projectcontinuum.feature.base.analytics.node.CreateTableNodeModel
                      outputs:
                        data:
                          name: output table
                          contentType: text/plain
                      properties:
                        jsonArrayString: "[{\"name\": \"  Alice \"}, {\"name\": \"\
                          BOB!\"}]"
                  - id: normalize
                    type: BaseNode
                    position:
                      x: 330
                      "y": 0
                    width: 250
                    height: 120
                    selected: false
                    data:
                      id: org.projectcontinuum.feature.base.analytics.node.TextNormalizerNodeModel
                      title: Text Normalizer
                      description: "Normalizes text by trimming, lowercasing, and\
                        \ removing non-alphanumeric characters"
                      nodeModel: org.projectcontinuum.feature.base.analytics.node.TextNormalizerNodeModel
                      inputs:
                        data:
                          name: input table
                          contentType: text/plain
                      outputs:
                        data:
                          name: output table
                          contentType: text/plain
                      properties:
                        inputCol: name
                        outputCol: clean_name
                  edges:
                  - id: reactflow__edge-createdata-normalizedata
                    type: BaseEdge
                    source: create
                    sourceHandle: data
                    target: normalize
                    targetHandle: data
            schema:
              $ref: "#/components/schemas/ContinuumWorkflowModel"
        description: The workflow to check.
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                invalid:
                  description: invalid
                  value:
                    valid: false
                    nodeCount: 2
                    edgeCount: 1
                    errors:
                    - message: Edge 'reactflow__edge-createdata-normalizedata' targets
                        unknown input port 'table' of node 'normalize'.
                      edge: reactflow__edge-createdata-normalizedata
                    warnings:
                    - message: Node 'normalize' has an input port 'data' with no incoming
                        edge.
                      node: normalize
              schema:
                $ref: "#/components/schemas/WorkflowValidationResponse"
          description: The verdict.
        "400":
          content:
            application/problem+json:
              examples:
                error:
                  value:
                    detail: Required request parameter 'baseDir' for method parameter
                      type String is not present
                    instance: /api/v1/workflow/tree
                    status: 400
                    title: Bad Request
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Malformed request: a missing or unparsable parameter, or a\
            \ body that is not valid JSON for this operation."
        "500":
          content:
            application/problem+json:
              examples:
                error:
                  value:
                    detail: Internal server error
                    instance: /api/v1/workflow/tree
                    status: 500
                    title: Internal Server Error
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Unexpected server error, or a dependency (PostgreSQL, Temporal,\
            \ S3) failed."
      security:
      - continuumUserId: []
      summary: Check a workflow without running it
      tags:
      - Workflows
  /api/v1/workflow/{workflowId}/cancel:
    post:
      description: |2-

        Asks one of the caller's runs to stop gracefully. The run is signalled at once (running nodes are told to stop and the
        run reports `CANCELLED`), and 5 seconds later Temporal cancellation is requested. Returns as soon as the signal was
        sent. Repeating it on a running workflow signals again; on a finished one it is a 404.
      operationId: cancelWorkflow
      parameters:
      - description: Workflow id returned by `POST /api/v1/workflow`.
        example: 6b1f0e4e-8f4a-4d8c-9d61-3c2b7f1a9e10
        in: path
        name: workflowId
        required: true
        schema:
          type: string
      - description: Why the run is cancelled; passed to the run's cancellation signal.
        example: Wrong input file
        in: query
        name: reason
        required: false
        schema:
          type: string
      responses:
        "204":
          description: Cancellation requested.
        "400":
          content:
            application/problem+json:
              examples:
                error:
                  value:
                    detail: Required request parameter 'baseDir' for method parameter
                      type String is not present
                    instance: /api/v1/workflow/tree
                    status: 400
                    title: Bad Request
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Malformed request: a missing or unparsable parameter, or a\
            \ body that is not valid JSON for this operation."
        "404":
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: Workflow not found
                instance: /api/v1/workflow/6b1f0e4e-8f4a-4d8c-9d61-3c2b7f1a9e10/cancel
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No running workflow with this id is owned by the caller (unknown,\
            \ another tenant's, or already finished)."
        "500":
          content:
            application/problem+json:
              examples:
                error:
                  value:
                    detail: Internal server error
                    instance: /api/v1/workflow/tree
                    status: 500
                    title: Internal Server Error
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Unexpected server error, or a dependency (PostgreSQL, Temporal,\
            \ S3) failed."
      security:
      - continuumUserId: []
      summary: Cancel a running workflow
      tags:
      - Workflows
  /api/v1/workflow/{workflowId}/status:
    get:
      description: |2-

        Returns the Temporal execution status and search attributes of one of the caller's runs. For the run's node statuses
        and outputs use `GET /api/v1/workflow-runs/{workflowId}`. Read-only.
      operationId: getWorkflowExecutionStatus
      parameters:
      - description: Workflow id returned by `POST /api/v1/workflow`.
        example: 6b1f0e4e-8f4a-4d8c-9d61-3c2b7f1a9e10
        in: path
        name: workflowId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowExecutionStatus"
          description: The execution status.
        "400":
          content:
            application/problem+json:
              examples:
                error:
                  value:
                    detail: Required request parameter 'baseDir' for method parameter
                      type String is not present
                    instance: /api/v1/workflow/tree
                    status: 400
                    title: Bad Request
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Malformed request: a missing or unparsable parameter, or a\
            \ body that is not valid JSON for this operation."
        "404":
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: Workflow not found
                instance: /api/v1/workflow/6b1f0e4e-8f4a-4d8c-9d61-3c2b7f1a9e10/cancel
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No run with this id is owned by the caller (unknown and other\
            \ tenants' ids are indistinguishable), or Temporal no longer has its execution\
            \ (retention expired)."
        "500":
          content:
            application/problem+json:
              examples:
                error:
                  value:
                    detail: Internal server error
                    instance: /api/v1/workflow/tree
                    status: 500
                    title: Internal Server Error
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Unexpected server error, or a dependency (PostgreSQL, Temporal,\
            \ S3) failed."
      security:
      - continuumUserId: []
      summary: Get the Temporal status of one workflow run
      tags:
      - Workflows
  /api/v1/workflow/{workflowId}/terminate:
    post:
      description: |2-

        Stops one of the caller's runs without waiting for its nodes. The run is signalled at once (it reports `TERMINATED`),
        and 5 seconds later Temporal terminates it with `reason` (default "Terminated via API"); no code of the run executes
        after that. Prefer `cancel` unless the run is stuck. On a finished run it is a 404.
      operationId: terminateWorkflow
      parameters:
      - description: Workflow id returned by `POST /api/v1/workflow`.
        example: 6b1f0e4e-8f4a-4d8c-9d61-3c2b7f1a9e10
        in: path
        name: workflowId
        required: true
        schema:
          type: string
      - description: Why the run is terminated; recorded by Temporal.
        example: Stuck in an external call
        in: query
        name: reason
        required: false
        schema:
          type: string
      responses:
        "204":
          description: Termination requested.
        "400":
          content:
            application/problem+json:
              examples:
                error:
                  value:
                    detail: Required request parameter 'baseDir' for method parameter
                      type String is not present
                    instance: /api/v1/workflow/tree
                    status: 400
                    title: Bad Request
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Malformed request: a missing or unparsable parameter, or a\
            \ body that is not valid JSON for this operation."
        "404":
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: Workflow not found
                instance: /api/v1/workflow/6b1f0e4e-8f4a-4d8c-9d61-3c2b7f1a9e10/cancel
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No running workflow with this id is owned by the caller (unknown,\
            \ another tenant's, or already finished)."
        "500":
          content:
            application/problem+json:
              examples:
                error:
                  value:
                    detail: Internal server error
                    instance: /api/v1/workflow/tree
                    status: 500
                    title: Internal Server Error
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Unexpected server error, or a dependency (PostgreSQL, Temporal,\
            \ S3) failed."
      security:
      - continuumUserId: []
      summary: Terminate a running workflow immediately
      tags:
      - Workflows
components:
  schemas:
    CanvasPosition:
      type: object
      description: "A point on the editor canvas, in pixels."
      properties:
        x:
          type: number
          format: double
          description: Horizontal position in pixels.
          example: 330.0
        "y":
          type: number
          format: double
          description: Vertical position in pixels.
          example: 0.0
      required:
      - x
      - "y"
    ContinuumWorkflowModel:
      type: object
      description: "A Continuum workflow: a directed acyclic graph of nodes and edges,\
        \ the content of a `.cwf` file in the workbench (React Flow format)."
      properties:
        active:
          type: boolean
          default: true
          description: Whether the workflow is active in the editor. Not used by the
            backend.
          example: true
        edges:
          type: array
          description: "The edges of the graph: each connects one output port to one\
            \ input port."
          items:
            $ref: "#/components/schemas/WorkflowEdge"
        id:
          type: string
          description: "Workflow id, chosen by the workbench (64 hex characters for\
            \ generated workflows)."
          example: a3f1c9e2b7d84f60a1c2e3d4f5a6b7c8d9e0f1a2b3c4d5e6f708192a3b4c5d6e
        name:
          type: string
          description: "Workflow name, normally the `.cwf` path in the workbench workspace.\
            \ A run stores it as its `workflowUri` and the run history groups by it,\
            \ so it must be a valid relative URI (no spaces)."
          example: examples/text-cleanup.cwf
        nodes:
          type: array
          description: The nodes of the graph.
          items:
            $ref: "#/components/schemas/WorkflowNode"
      required:
      - id
      - name
    CreateWorkflowScheduleRequest:
      type: object
      description: A cron schedule that starts the given workflow repeatedly.
      properties:
        continuumWorkflowModel:
          $ref: "#/components/schemas/ContinuumWorkflowModel"
          description: The workflow to run on each fire. Validated like a start; stored
            as sent.
        cronExpression:
          type: string
          description: "Cron expression in Temporal's syntax: 5 fields (minute hour\
            \ day-of-month month day-of-week) or a macro such as `@daily`."
          example: 0 2 * * *
        name:
          type: string
          description: "Schedule name, unique per owner by convention (not enforced).\
            \ The workbench uses `<workflow path>/<schedule>.schedule`."
          example: examples/text-cleanup.cwf/nightly.schedule
        timeZone:
          type:
          - string
          - "null"
          description: IANA time zone the cron expression is evaluated in. Default
            UTC.
          example: Europe/Berlin
      required:
      - continuumWorkflowModel
      - cronExpression
      - name
    NodeData:
      type: object
      description: "A node type's definition (as registered by its feature worker)\
        \ plus, inside a workflow, the instance's properties and runtime state. When\
        \ a workflow is started or validated, `inputs`, `outputs` and `propertiesSchema`\
        \ come from the node registry; the copies in the request are only compared\
        \ (a difference is a warning)."
      properties:
        busy:
          type:
          - boolean
          - "null"
          description: Editor busy flag. Not used by the backend.
          example: false
        description:
          type: string
          description: "What the node does, shown in the palette."
          example: "Normalizes text by trimming, lowercasing, and removing non-alphanumeric\
            \ characters"
        icon:
          type:
          - string
          - "null"
          description: Inline SVG icon markup.
          example: <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"></svg>
        id:
          type:
          - string
          - "null"
          description: Node type id; the same as `nodeModel` for registered nodes.
          example: org.projectcontinuum.feature.base.analytics.node.TextNormalizerNodeModel
        inputs:
          type:
          - object
          - "null"
          additionalProperties:
            $ref: "#/components/schemas/NodePort"
          description: "Input ports: port id → port. Absent for source (trigger) nodes."
        nodeModel:
          type: string
          description: "Registered node type: the fully qualified class name of the\
            \ node model in its feature worker. Decides which worker (task queue)\
            \ runs the node."
          example: org.projectcontinuum.feature.base.analytics.node.TextNormalizerNodeModel
        nodeProgress:
          oneOf:
          - $ref: "#/components/schemas/NodeProgress"
          - type: "null"
        outputs:
          type:
          - object
          - "null"
          additionalProperties:
            $ref: "#/components/schemas/NodePort"
          description: "Output ports: port id → port."
        properties:
          type: object
          additionalProperties: {}
          description: "Property values of this node, validated against the registered\
            \ `propertiesSchema` (JSON Schema draft 7) when the workflow is started,\
            \ scheduled or validated. In the registry: the defaults."
          example:
            inputCol: name
            outputCol: clean_name
        propertiesSchema:
          type: object
          additionalProperties: {}
          description: JSON Schema (draft 7) of `properties`. The registered one is
            authoritative.
        propertiesUISchema:
          type: object
          additionalProperties: {}
          description: JSONForms UI schema the workbench renders the property dialog
            from. Not used by the backend.
        retryOptions:
          oneOf:
          - $ref: "#/components/schemas/NodeRetryOptions"
          - type: "null"
        status:
          type:
          - string
          - "null"
          description: "Runtime status of the node, set by the orchestrator during\
            \ a run. Null before the run reaches it."
          enum:
          - ACTIVE
          - CONFIGURED
          - SCHEDULED
          - BUSY
          - SUCCESS
          - FAILED
          - CANCELLED
          - WARNING
          - PRE_PROCESSING
          - POST_PROCESSING
          - SKIPPED
          example: SUCCESS
        subTitle:
          type:
          - string
          - "null"
          description: Short secondary label.
          example: Clean and normalize text
        title:
          type: string
          description: Display name of the node type.
          example: Text Normalizer
      required:
      - description
      - nodeModel
      - title
    NodeExplorerItem:
      type: object
      description: A category or a node in the node palette.
      properties:
        children:
          type:
          - array
          - "null"
          description: "Children, filled only in search results (the ancestors of\
            \ each match). Null when not loaded."
          items:
            $ref: "#/components/schemas/NodeExplorerItem"
        hasChildren:
          type: boolean
          default: false
          description: Whether a category has children; always false for nodes.
          example: false
        id:
          type: string
          description: "For a category: its path from the root (`Analytics/Text`),\
            \ the `parentId` to list its children. For a node: the node id (fully\
            \ qualified class name)."
          example: org.projectcontinuum.feature.base.analytics.node.TextNormalizerNodeModel
        name:
          type: string
          description: Display name.
          example: Text Normalizer
        nodeInfo:
          oneOf:
          - $ref: "#/components/schemas/NodeData"
          - type: "null"
        type:
          type: string
          default: CATEGORY
          description: Whether this is a category or a node.
          enum:
          - CATEGORY
          - NODE
          example: NODE
      required:
      - id
      - name
    NodeOutputPage:
      type: object
      description: One page of rows of a node output table.
      properties:
        currentPage:
          type: integer
          format: int32
          description: Zero-based number of this page.
          example: 0
        currentPageSize:
          type: integer
          format: int32
          description: Requested page size (rows per page).
          example: 10
        data:
          type: array
          description: The rows of this page; each row is the list of its cells in
            column order.
          items:
            type: array
            items:
              $ref: "#/components/schemas/TableCell"
        hasNext:
          type: boolean
          description: Whether a later page exists.
          example: true
        hasPrevious:
          type: boolean
          description: Whether an earlier page exists.
          example: false
        totalElements:
          type: integer
          format: int64
          description: Number of rows in the table.
          example: 42
        totalPages:
          type: integer
          format: int32
          description: Number of pages.
          example: 5
      required:
      - currentPage
      - currentPageSize
      - data
      - hasNext
      - hasPrevious
      - totalElements
      - totalPages
    NodePort:
      type: object
      description: An input or output port of a node type.
      properties:
        contentType:
          type: string
          description: Media type of the data on the port; tables are Parquet.
          example: text/plain
        name:
          type: string
          description: Display name of the port.
          example: input table
      required:
      - contentType
      - name
    NodeProgress:
      type: object
      description: Progress a worker reported for a running node.
      properties:
        message:
          type:
          - string
          - "null"
          description: Human-readable progress message.
          example: Uploading outputs
        progressPercentage:
          type: integer
          format: int32
          description: "Progress of the node, in percent (0-100)."
          example: 40
          maximum: 100
          minimum: 0
        stageDurationMs:
          type:
          - integer
          - "null"
          format: int64
          description: "Duration of the current stage so far, in milliseconds."
          example: 1250
        stageStatus:
          type:
          - object
          - "null"
          additionalProperties:
            type: string
            description: Status of one stage of a running node.
            enum:
            - PENDING
            - IN_PROGRESS
            - COMPLETED
            - FAILED
            - SKIPPED
          description: "Status per stage: stage name → status."
          example:
            Download inputs: COMPLETED
            Execute: IN_PROGRESS
        totalDurationMs:
          type:
          - integer
          - "null"
          format: int64
          description: "Time since the node started, in milliseconds."
          example: 4100
      required:
      - progressPercentage
    NodeRetryOptions:
      type: object
      description: Per-node Temporal activity retry policy. A null field falls back
        to the workflow-wide default.
      properties:
        backoffCoefficient:
          type:
          - number
          - "null"
          format: double
          description: Factor the delay grows by after each retry.
          example: 2.0
        doNotRetry:
          type:
          - array
          - "null"
          description: Exception class names that are never retried.
          example:
          - java.lang.IllegalArgumentException
          items:
            type: string
        initialIntervalSeconds:
          type:
          - integer
          - "null"
          format: int64
          description: "Delay before the first retry, in seconds."
          example: 1
        maximumAttempts:
          type:
          - integer
          - "null"
          format: int32
          description: Maximum number of attempts including the first; 1 disables
            retries.
          example: 3
        maximumIntervalSeconds:
          type:
          - integer
          - "null"
          format: int64
          description: "Upper bound of the delay between retries, in seconds."
          example: 60
    PageMetadata:
      type: object
      properties:
        number:
          type: integer
          format: int64
        size:
          type: integer
          format: int64
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
    PagedModelString:
      type: object
      properties:
        content:
          type: array
          items:
            type: string
        page:
          $ref: "#/components/schemas/PageMetadata"
    PagedModelWorkflowRunSummary:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowRunSummary"
        page:
          $ref: "#/components/schemas/PageMetadata"
    PortData:
      type: object
      description: One output of a node. A produced port references its Parquet file
        in object storage; a failed node has the single port `$error` whose `data`
        is the error message.
      properties:
        contentType:
          type: string
          description: "Media type of `data`: `application/parquet` for a stored table,\
            \ `text/plain` for the `$error` message."
          example: application/parquet
        data:
          type: string
          description: "For a table: its location, `{remote}<runId>/<nodeId>/output.<port>.parquet`\
            \ (read it with the node output endpoint). For `$error`: the error message."
          example: "{remote}0b7c6f0a-2a55-4f43-9a36-0c8f4d2b1e77/normalize/output.data.parquet"
        status:
          type: string
          description: "Whether the port was produced (`SUCCESS`), produced with warnings\
            \ (`WARNING`) or is the error of a failed node (`FAILED`)."
          enum:
          - SUCCESS
          - FAILED
          - WARNING
          example: SUCCESS
        tableSpec:
          type: array
          description: "Columns of the table: one `{name, contentType}` entry per\
            \ column. Empty for `$error`."
          items:
            type: object
            additionalProperties:
              type: string
      required:
      - contentType
      - data
      - status
      - tableSpec
    ProblemDetail:
      type: object
      description: "RFC 9457 problem detail, the error body of every Continuum service\
        \ (`application/problem+json`)."
      properties:
        detail:
          type: string
          description: Human-readable explanation of this occurrence.
          example: Workflow run not found
        instance:
          type: string
          format: uri-reference
          description: Path of the request that produced the problem.
          example: /api/v1/workflow-runs/3f2c...
        status:
          type: integer
          format: int32
          description: HTTP status code of this response.
          example: 404
        title:
          type: string
          description: Short summary of the problem type (the HTTP reason phrase by
            default).
          example: Not Found
        type:
          type: string
          format: uri-reference
          description: URI identifying the problem type; `about:blank` when only the
            status code matters.
          example: about:blank
      required:
      - status
      - title
      - type
    StartWorkflowResponse:
      type: object
      description: The started run.
      properties:
        warnings:
          type: array
          description: "Validation findings that did not block the start, e.g. an\
            \ input port with no incoming edge."
          items:
            $ref: "#/components/schemas/WorkflowIssue"
        workflowId:
          type: string
          description: "Workflow id of the new run (a UUID). Use it with the status,\
            \ cancel and terminate endpoints, `GET /api/v1/workflow-runs/{workflowId}`\
            \ and the MQTT topic `continuum/workflow/execution/{workflowId}/update`."
          example: 6b1f0e4e-8f4a-4d8c-9d61-3c2b7f1a9e10
      required:
      - workflowId
    TableCell:
      type: object
      description: One cell of a node output table row.
      properties:
        contentType:
          type: string
          description: "Media type of the cell value, as written by the node."
          example: text/plain
        name:
          type: string
          description: Column name.
          example: clean
        value:
          type: string
          format: byte
          description: "Raw cell bytes, base64-encoded. Decode them according to `contentType`\
            \ (e.g. UTF-8 text for `text/plain`)."
          example: aGVsbG8gd29ybGQ=
      required:
      - contentType
      - name
      - value
    WorkflowEdge:
      type: object
      description: An edge from an output port of one node to an input port of another.
      properties:
        animated:
          type:
          - boolean
          - "null"
          description: Whether the editor animates the edge. Set by the orchestrator
            while data flows.
          example: false
        data:
          oneOf:
          - $ref: "#/components/schemas/WorkflowEdgeData"
          - type: "null"
        id:
          type: string
          description: "Edge id, unique in the workflow."
          example: reactflow__edge-createdata-normalizedata
        source:
          type: string
          description: "Id of the source node (`nodes[].id`)."
          example: create
        sourceHandle:
          type: string
          description: Output port id of the source node (a key of its `data.outputs`).
          example: data
        target:
          type: string
          description: "Id of the target node (`nodes[].id`)."
          example: normalize
        targetHandle:
          type: string
          description: Input port id of the target node (a key of its `data.inputs`).
            One edge per input port.
          example: data
        type:
          type:
          - string
          - "null"
          description: React Flow edge type. The workbench uses `BaseEdge`.
          example: BaseEdge
      required:
      - id
      - source
      - sourceHandle
      - target
      - targetHandle
    WorkflowEdgeData:
      type: object
      description: "Runtime state of an edge, set by the orchestrator."
      properties:
        status:
          type:
          - string
          - "null"
          description: Edge status. Absent (null) while the source node has not finished.
          enum:
          - DELIVERED
          - BROKEN
          example: DELIVERED
    WorkflowExecutionCount:
      type: object
      description: Number of the caller's Temporal executions that match the query.
      properties:
        count:
          type: integer
          format: int32
          description: Total number of matching executions.
          example: 12
        groups:
          type: array
          description: Counts per execution status; only filled when the query ends
            with `GROUP BY ExecutionStatus`.
          items:
            $ref: "#/components/schemas/WorkflowExecutionCountGroup"
      required:
      - count
      - groups
    WorkflowExecutionCountGroup:
      type: object
      description: Number of executions with one execution status.
      properties:
        count:
          type: integer
          format: int32
          description: Number of executions in this group.
          example: 3
        name:
          type: string
          description: "The group value as Temporal returns it: the JSON-encoded execution\
            \ status (quotes included)."
          example: '"Running"'
      required:
      - count
      - name
    WorkflowExecutionStatus:
      type: object
      description: A workflow execution as Temporal sees it.
      properties:
        metadata:
          type: object
          additionalProperties:
            type: string
          description: "Temporal search attributes of the execution (except `BuildIds`):\
            \ name → raw JSON-encoded value. `Continuum:WorkflowFileName` is the workflow\
            \ name, `Continuum:ExecutionStatus` the numeric execution status."
          example:
            Continuum:WorkflowFileName: '"examples/text-cleanup.cwf"'
            Continuum:ExecutionStatus: "2"
        temporalStatus:
          type: string
          description: Temporal execution status.
          enum:
          - WORKFLOW_EXECUTION_STATUS_UNSPECIFIED
          - WORKFLOW_EXECUTION_STATUS_RUNNING
          - WORKFLOW_EXECUTION_STATUS_COMPLETED
          - WORKFLOW_EXECUTION_STATUS_FAILED
          - WORKFLOW_EXECUTION_STATUS_CANCELED
          - WORKFLOW_EXECUTION_STATUS_TERMINATED
          - WORKFLOW_EXECUTION_STATUS_CONTINUED_AS_NEW
          - WORKFLOW_EXECUTION_STATUS_TIMED_OUT
          example: WORKFLOW_EXECUTION_STATUS_COMPLETED
        type:
          type: string
          description: Temporal workflow type.
          example: IContinuumWorkflow
        workflowId:
          type: string
          description: Workflow id.
          example: 6b1f0e4e-8f4a-4d8c-9d61-3c2b7f1a9e10
      required:
      - metadata
      - temporalStatus
      - type
      - workflowId
    WorkflowIssue:
      type: object
      description: "One problem found by the workflow validator. `node`, `edge` and\
        \ `property` say where it is, when that applies; absent ones are omitted."
      properties:
        edge:
          type:
          - string
          - "null"
          description: "Id of the edge concerned (`edges[].id`)."
          example: reactflow__edge-createdata-normalizedata
        message:
          type: string
          description: Human-readable description of the issue.
          example: "Node 'normalize': property 'inputCol' is required."
        node:
          type:
          - string
          - "null"
          description: "Id of the node concerned (`nodes[].id`)."
          example: normalize
        property:
          type:
          - string
          - "null"
          description: Top-level node property concerned.
          example: inputCol
      required:
      - message
    WorkflowNode:
      type: object
      description: "A node of the workflow: an instance of a registered node type\
        \ with its properties and editor layout."
      properties:
        data:
          $ref: "#/components/schemas/NodeData"
          description: "The node type, its properties and its runtime state."
        dragging:
          type:
          - boolean
          - "null"
          description: Whether the node is being dragged in the editor. Not used by
            the backend.
          example: false
        height:
          type: integer
          format: int32
          description: "Rendered height in the editor, in pixels."
          example: 120
        id:
          type: string
          description: "Node id, unique in the workflow. Edges and node outputs refer\
            \ to it."
          example: normalize
        position:
          $ref: "#/components/schemas/CanvasPosition"
          description: Position of the node in the editor canvas.
        positionAbsolute:
          oneOf:
          - $ref: "#/components/schemas/CanvasPosition"
          - type: "null"
        selected:
          type: boolean
          description: Whether the node is selected in the editor. Not used by the
            backend.
          example: false
        type:
          type: string
          description: React Flow node type. The workbench uses `BaseNode`.
          example: BaseNode
        width:
          type: integer
          format: int32
          description: "Rendered width in the editor, in pixels."
          example: 250
      required:
      - data
      - height
      - id
      - position
      - selected
      - type
      - width
    WorkflowRun:
      type: object
      description: One workflow run with the workflow as it ran (live node and edge
        statuses) and the outputs produced so far.
      properties:
        createdAt:
          type: string
          format: date-time
          description: "When the run was accepted (ISO-8601, UTC)."
          example: 2026-11-21T09:15:02.481Z
        data:
          $ref: "#/components/schemas/WorkflowRunData"
          description: Snapshot of the workflow and its outputs as of the last run
            event.
        ownedBy:
          type: string
          description: Owner of the run.
          example: alice
        progressPercentage:
          type: integer
          format: int32
          description: "Share of nodes that are done, in percent (0-100)."
          example: 100
          maximum: 100
          minimum: 0
        runId:
          type:
          - string
          - "null"
          description: "Temporal run id. Node outputs are stored under it, so it is\
            \ the `runId` of the node output endpoint. Null until the run has started."
          example: 0b7c6f0a-2a55-4f43-9a36-0c8f4d2b1e77
        scheduleId:
          type:
          - string
          - "null"
          format: uuid
          description: Schedule that started the run; null for runs started directly.
          example: null
        status:
          type: string
          description: "Run status as last reported. `PENDING`: accepted, no event\
            \ yet. `STARTED`: the orchestrator picked it up. `RUNNING`: nodes are\
            \ executing. `FINISHED`: every node is done (some may have failed or been\
            \ skipped; see the node statuses). `FAILED`: the run failed. `CANCELLED`\
            \ / `TERMINATED`: stopped through the API."
          enum:
          - PENDING
          - STARTED
          - RUNNING
          - FINISHED
          - FAILED
          - CANCELLED
          - TERMINATED
          example: FINISHED
        updatedAt:
          type: string
          format: date-time
          description: "When the last run event was stored (ISO-8601, UTC)."
          example: 2026-11-21T09:15:09.112Z
        workflowId:
          type: string
          description: Workflow id returned by `POST /api/v1/workflow` (the Temporal
            workflow id).
          example: 6b1f0e4e-8f4a-4d8c-9d61-3c2b7f1a9e10
        workflowType:
          type: string
          description: Temporal workflow type. Always `IContinuumWorkflow` today.
          example: IContinuumWorkflow
        workflowUri:
          type: string
          format: uri-reference
          description: "The workflow's `name`, normally the `.cwf` path."
          example: examples/text-cleanup.cwf
      required:
      - createdAt
      - data
      - ownedBy
      - progressPercentage
      - status
      - updatedAt
      - workflowId
      - workflowType
      - workflowUri
    WorkflowRunCount:
      type: object
      description: Number of runs that match the filter.
      properties:
        count:
          type: integer
          format: int64
          description: Number of the caller's runs that match the filter.
          example: 42
      required:
      - count
    WorkflowRunData:
      type: object
      description: The workflow as it ran and the outputs of its nodes.
      properties:
        nodeToOutputMap:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              $ref: "#/components/schemas/PortData"
            description: "Outputs per node: node id → port id → output."
          description: "Outputs per node: node id → port id → output. A port produced\
            \ by the node points to its Parquet file (`{remote}<runId>/<nodeId>/output.<port>.parquet`);\
            \ a node that failed has the port `$error` with the message."
          example:
            normalize:
              data:
                status: SUCCESS
                contentType: application/parquet
                tableSpec:
                - name: clean
                  contentType: text/plain
                data: "{remote}0b7c6f0a-2a55-4f43-9a36-0c8f4d2b1e77/normalize/output.data.parquet"
          properties:
            empty:
              type: boolean
            entries:
              type: array
              items:
                type: object
                properties:
                  key:
                    type: string
                  value:
                    type: object
                    additionalProperties:
                      $ref: "#/components/schemas/PortData"
              uniqueItems: true
            keys:
              type: array
              items:
                type: string
              uniqueItems: true
            size:
              type: integer
              format: int32
            values:
              type: array
              items:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/PortData"
        workflowSnapshot:
          $ref: "#/components/schemas/ContinuumWorkflowModel"
          description: The submitted workflow with the live `data.status` of every
            node and edge from the last run event.
      required:
      - nodeToOutputMap
      - workflowSnapshot
    WorkflowRunSummary:
      type: object
      description: One workflow run without its snapshot and outputs (the list view).
      properties:
        createdAt:
          type: string
          format: date-time
          description: "When the run was accepted (ISO-8601, UTC)."
          example: 2026-11-21T09:15:02.481Z
        ownedBy:
          type: string
          description: Owner of the run (the `x-continuum-user-id` of the caller that
            started it).
          example: alice
        progressPercentage:
          type: integer
          format: int32
          description: "Share of nodes that are done, in percent (0-100)."
          example: 100
          maximum: 100
          minimum: 0
        scheduleId:
          type:
          - string
          - "null"
          format: uuid
          description: Schedule that started the run; null for runs started directly.
          example: null
        status:
          type: string
          description: "Run status as last reported. `PENDING`: accepted, no event\
            \ yet. `STARTED`: the orchestrator picked it up. `RUNNING`: nodes are\
            \ executing. `FINISHED`: every node is done (some may have failed or been\
            \ skipped; see the node statuses). `FAILED`: the run failed. `CANCELLED`\
            \ / `TERMINATED`: stopped through the API."
          enum:
          - PENDING
          - STARTED
          - RUNNING
          - FINISHED
          - FAILED
          - CANCELLED
          - TERMINATED
          example: FINISHED
        updatedAt:
          type: string
          format: date-time
          description: "When the last run event was stored (ISO-8601, UTC)."
          example: 2026-11-21T09:15:09.112Z
        workflowId:
          type: string
          description: Workflow id returned by `POST /api/v1/workflow` (the Temporal
            workflow id).
          example: 6b1f0e4e-8f4a-4d8c-9d61-3c2b7f1a9e10
        workflowType:
          type: string
          description: Temporal workflow type. Always `IContinuumWorkflow` today.
          example: IContinuumWorkflow
        workflowUri:
          type: string
          format: uri-reference
          description: "The workflow's `name`, normally the `.cwf` path in the workbench\
            \ workspace."
          example: examples/text-cleanup.cwf
      required:
      - createdAt
      - ownedBy
      - progressPercentage
      - status
      - updatedAt
      - workflowId
      - workflowType
      - workflowUri
    WorkflowSchedule:
      type: object
      description: A cron schedule with its live state from Temporal.
      properties:
        continuumWorkflowModel:
          $ref: "#/components/schemas/ContinuumWorkflowModel"
          description: The workflow each fire runs.
        createdAt:
          type: string
          format: date-time
          description: "When the schedule was created (ISO-8601, UTC)."
          example: 2026-11-21T09:00:00Z
        cronExpression:
          type: string
          description: Cron expression (Temporal syntax).
          example: 0 2 * * *
        name:
          type: string
          description: Schedule name.
          example: examples/text-cleanup.cwf/nightly.schedule
        nextRunTimes:
          type: array
          description: "Next fire times computed by Temporal (ISO-8601, UTC). Empty\
            \ while paused."
          example:
          - 2026-11-22T01:00:00Z
          items:
            type: string
            format: date-time
        ownedBy:
          type: string
          description: Owner of the schedule (and of the runs it starts).
          example: alice
        paused:
          type: boolean
          description: Whether the schedule is paused (live from Temporal).
          example: false
        scheduleId:
          type: string
          format: uuid
          description: Schedule id; also the Temporal schedule id and the workflow
            id of the runs it starts.
          example: 1d0f3c52-7a3b-4c8e-9d4f-2b6a8e1f0c3d
        timeZone:
          type:
          - string
          - "null"
          description: IANA time zone of the cron expression; null means UTC.
          example: Europe/Berlin
        updatedAt:
          type: string
          format: date-time
          description: "When the schedule row was last changed (ISO-8601, UTC)."
          example: 2026-11-21T09:00:00Z
      required:
      - continuumWorkflowModel
      - createdAt
      - cronExpression
      - name
      - nextRunTimes
      - ownedBy
      - paused
      - scheduleId
      - updatedAt
    WorkflowTreeExecution:
      type: object
      description: "One execution in the workflow tree, rebuilt from its Temporal\
        \ history."
      properties:
        createdAtTimestampUtc:
          type: integer
          format: int64
          description: "When the first workflow task was scheduled, in epoch milliseconds\
            \ (UTC)."
          example: 1763716502481
        id:
          type: string
          description: Workflow id (same as `workflowId`).
          example: 6b1f0e4e-8f4a-4d8c-9d61-3c2b7f1a9e10
        nodeToOutputsMap:
          type:
          - object
          - "null"
          additionalProperties:
            type: object
            additionalProperties:
              $ref: "#/components/schemas/PortData"
          description: "Outputs per node: node id → port id → output. From the result\
            \ of a completed execution, otherwise from the node activities completed\
            \ so far."
        status:
          type: string
          description: "Last workflow execution event of the history, or `UNKNOWN`."
          enum:
          - UNKNOWN
          - WORKFLOW_EXECUTION_STARTED
          - WORKFLOW_EXECUTION_COMPLETED
          - WORKFLOW_EXECUTION_FAILED
          - WORKFLOW_EXECUTION_TIMED_OUT
          - WORKFLOW_EXECUTION_CANCEL_REQUESTED
          - WORKFLOW_EXECUTION_CANCELED
          - WORKFLOW_EXECUTION_TERMINATED
          - WORKFLOW_EXECUTION_CONTINUED_AS_NEW
          - WORKFLOW_EXECUTION_SIGNALED
          - WORKFLOW_EXECUTION_UPDATE_ACCEPTED
          - WORKFLOW_EXECUTION_UPDATE_REJECTED
          - WORKFLOW_EXECUTION_UPDATE_COMPLETED
          - WORKFLOW_EXECUTION_UPDATE_ADMITTED
          - WORKFLOW_EXECUTION_OPTIONS_UPDATED
          example: WORKFLOW_EXECUTION_COMPLETED
        updatesAtTimestampUtc:
          type: integer
          format: int64
          description: "Time of the last history event, in epoch milliseconds (UTC)."
          example: 1763716509112
        workflowId:
          type: string
          description: Workflow id.
          example: 6b1f0e4e-8f4a-4d8c-9d61-3c2b7f1a9e10
        workflow_snapshot:
          oneOf:
          - $ref: "#/components/schemas/ContinuumWorkflowModel"
          - type: "null"
      required:
      - createdAtTimestampUtc
      - id
      - status
      - updatesAtTimestampUtc
      - workflowId
    WorkflowTreeItem:
      type: object
      description: "A folder of the workflow path, or one execution of a workflow."
      properties:
        children:
          type:
          - array
          - "null"
          description: "Sub-folders and executions, newest first; null for executions."
          items:
            $ref: "#/components/schemas/WorkflowTreeItem"
        id:
          type: string
          description: "Folder name, or the workflow id for an execution."
