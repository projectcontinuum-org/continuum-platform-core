                    status: 400
                    title: Bad Request
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Malformed request: a missing or unparsable parameter, or a\
            \ body that is not valid JSON for this operation."
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "A stored schedule no longer exists in Temporal (TODO: one\
            \ stale schedule fails the whole list), or Temporal failed."
      security:
      - continuumUserId: []
      summary: List the caller's schedules
      tags:
      - Workflow schedules
    post:
      description: |2-

        Creates a Temporal schedule that starts the given workflow on every match of `cronExpression` (in `timeZone`, default
        UTC), owned by the caller. Used by the workbench's schedule dialog and the KNIME scheduler.

        The workflow is validated exactly like `POST /api/v1/workflow` before anything is created. It is stored as sent and is
        **not** revalidated when the schedule fires; operators can check stored schedules with the administration endpoint.
        Each fire starts a run (workflow id = schedule id) whose `scheduleId` is set in the run history. Not idempotent: every
        call creates a new schedule.
      operationId: createWorkflowSchedule
      requestBody:
        content:
          application/json:
            examples:
              nightly:
                description: nightly
                summary: Every night at 02:00 Berlin time
                value:
                  name: examples/text-cleanup.cwf/nightly.schedule
                  cronExpression: 0 2 * * *
                  timeZone: Europe/Berlin
                  continuumWorkflowModel:
                    id: a3f1c9e2b7d84f60a1c2e3d4f5a6b7c8d9e0f1a2b3c4d5e6f708192a3b4c5d6e
                    name: examples/text-cleanup.cwf
                    active: false
                    nodes:
                    - id: create
                      type: BaseNode
                      position:
                        x: 0
                        "y": 0
                      width: 250
                      height: 120
                      selected: false
                      data:
                        id: org.projectcontinuum.feature.base.analytics.node.CreateTableNodeModel
                        title: Create Table
                        description: Creates a structured table from FreeMarker template
                          configuration
                        nodeModel: org.projectcontinuum.feature.base.analytics.node.CreateTableNodeModel
                        outputs:
                          data:
                            name: output table
                            contentType: text/plain
                        properties:
                          jsonArrayString: "[{\"name\": \"  Alice \"}, {\"name\":\
                            \ \"BOB!\"}]"
                    - id: normalize
                      type: BaseNode
                      position:
                        x: 330
                        "y": 0
                      width: 250
                      height: 120
                      selected: false
                      data:
                        id: org.projectcontinuum.feature.base.analytics.node.TextNormalizerNodeModel
                        title: Text Normalizer
                        description: "Normalizes text by trimming, lowercasing, and\
                          \ removing non-alphanumeric characters"
                        nodeModel: org.projectcontinuum.feature.base.analytics.node.TextNormalizerNodeModel
                        inputs:
                          data:
                            name: input table
                            contentType: text/plain
                        outputs:
                          data:
                            name: output table
                            contentType: text/plain
                        properties:
                          inputCol: name
                          outputCol: clean_name
                    edges:
                    - id: reactflow__edge-createdata-normalizedata
                      type: BaseEdge
                      source: create
                      sourceHandle: data
                      target: normalize
                      targetHandle: data
            schema:
              $ref: "#/components/schemas/CreateWorkflowScheduleRequest"
        description: The schedule and the workflow it runs.
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowSchedule"
          description: Schedule created.
        "400":
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Invalid workflow
                status: 400
                detail: "Invalid workflow: 1 error(s). Node 'normalize' (org.projectcontinuum.feature.base.analytics.node.TextNormalizerNodeModel):\
                  \ property 'outputCol' is required."
                instance: /api/v1/workflow
                errors:
                - message: "Node 'normalize' (org.projectcontinuum.feature.base.analytics.node.TextNormalizerNodeModel):\
                    \ property 'outputCol' is required."
                  node: normalize
                  property: outputCol
                warnings: []
              schema:
                $ref: "#/components/schemas/WorkflowValidationProblem"
          description: "The workflow is invalid (`errors` lists every problem), Temporal\
            \ rejected the cron expression or time zone, or the body is malformed."
        "500":
          content:
            application/problem+json:
              examples:
                error:
                  value:
                    detail: Internal server error
                    instance: /api/v1/workflow/tree
                    status: 500
                    title: Internal Server Error
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Unexpected server error, or a dependency (PostgreSQL, Temporal,\
            \ S3) failed."
      security:
      - continuumUserId: []
      summary: Create a cron schedule for a workflow
      tags:
      - Workflow schedules
