openapi: 3.1.0
info:
  contact:
    name: Project Continuum
    url: https://github.com/projectcontinuum-org/continuum-platform-core
  description: |-
    Stores the secrets Continuum workflow nodes need (API keys, database passwords, cloud credentials) so
    they never appear in a workflow. A workflow only names a credential; when a node runs, its feature worker
    fetches the credential by name, on behalf of the workflow's owner, with `GET /api/v1/credentials/{name}`.

    A credential is a flat map of string values, encrypted per value with AES-GCM before it is stored and
    returned decrypted to its owner. Each credential has a **credential type** (with versions) whose JSON
    Schema (draft 4) the values must satisfy; the built-in `GENERIC` type accepts any string values.

    **Identity.** Continuum has no built-in authentication. The owner is the `x-continuum-user-id` header, set
    by the trusted reverse proxy; every credential endpoint only sees the caller's own credentials. Without the
    header the caller is `anonymous` (local development). Credential types are shared by all users.

    **Errors** are RFC 9457 problem details (`application/problem+json`). They also carry the message in a
    deprecated `error` property for clients of the former `{"error": "..."}` bodies.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  title: Continuum Credentials Server
  version: 0.0.23
externalDocs:
  description: Continuum documentation
  url: https://docs.projectcontinuum.org
servers:
- description: Continuum Credentials Server
  url: /
tags:
- description: "The caller's credentials: create, read (decrypted), update and delete."
  name: Credentials
- description: "Credential types and their versions: the schema credential values\
    \ must satisfy. Not user-scoped."
  name: Credential types
paths:
  /api/v1/credential-types:
    get:
      description: "Returns all type versions, including the built-in `GENERIC` 1.0.0\
        \ (any string values). Not user-scoped: every caller sees the same types.\
        \ Read-only."
      operationId: listCredentialTypes
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CredentialType"
          description: The type versions.
        "406":
          content:
            application/problem+json:
              examples:
                error:
                  value:
                    detail: "Acceptable representations: [application/json]."
                    error: "Acceptable representations: [application/json]."
                    instance: /api/v1/credentials
                    status: 406
                    title: Not Acceptable
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The `Accept` header asks for a media type this operation does
            not produce.
        "500":
          content:
            application/problem+json:
              examples:
                error:
                  value:
                    detail: Internal server error
                    error: Internal server error
                    instance: /api/v1/credentials
                    status: 500
                    title: Internal Server Error
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The database or the encryption failed, or an unexpected error\
            \ occurred."
      summary: List every credential type version
      tags:
      - Credential types
    post:
      description: |2-

        Adds a version of a credential type: the JSON Schema (draft 4) that credential `data` of this type must satisfy, and
        the JSONForms UI schema the management UI renders the form from. Types are immutable: there is no update or delete.
        The same type with an identical schema and UI schema cannot be registered under a second version. Any caller can
        register types (TODO: restrict to operators?). Not user-scoped: every caller sees the same types.
      operationId: createCredentialType
      requestBody:
        content:
          application/json:
            examples:
              postgres:
                description: postgres
                summary: PostgreSQL connection
                value:
                  type: postgres
                  version: 1.0.0
                  schema:
                    type: object
                    required:
                    - host
                    - username
                    - password
                    properties:
                      host:
                        type: string
                      port:
                        type: string
                        pattern: "^[0-9]+$"
                      username:
                        type: string
                      password:
                        type: string
                    additionalProperties: false
                  uiSchema:
                    type: VerticalLayout
                    elements:
                    - type: Control
                      scope: "#/properties/host"
                    - type: Control
                      scope: "#/properties/port"
                    - type: Control
                      scope: "#/properties/username"
                    - type: Control
                      scope: "#/properties/password"
                      options:
                        format: password
            schema:
              $ref: "#/components/schemas/CredentialTypeCreateRequest"
        description: The type version.
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialType"
          description: Registered.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "A field is invalid (`fieldErrors` lists each one), or the\
            \ body is malformed."
        "409":
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Conflict
                status: 409
                detail: Credential type 'postgres' version '1.0.0' already exists
                instance: /api/v1/credential-types
                error: Credential type 'postgres' version '1.0.0' already exists
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "This type version exists, or the same type and schemas exist\
            \ under another version."
        "500":
          content:
            application/problem+json:
              examples:
                error:
                  value:
                    detail: Internal server error
                    error: Internal server error
                    instance: /api/v1/credentials
                    status: 500
                    title: Internal Server Error
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The database or the encryption failed, or an unexpected error\
            \ occurred."
      summary: Register a credential type version
      tags:
      - Credential types
  /api/v1/credential-types/{type}:
    get:
      description: "Returns every version of a credential type. Not user-scoped: every\
        \ caller sees the same types. Read-only."
      operationId: listCredentialTypeVersions
      parameters:
      - description: Credential type.
        example: GENERIC
        in: path
        name: type
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CredentialType"
          description: The versions (never empty).
        "400":
          content:
            application/problem+json:
              examples:
                error:
                  value:
                    detail: Failed to read request
                    error: Failed to read request
                    instance: /api/v1/credentials
                    status: 400
                    title: Bad Request
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Malformed request: a missing or unparsable parameter, or a\
            \ body that is not valid JSON."
        "404":
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: Credential type 'postgres' not found
                instance: /api/v1/credential-types/postgres
                error: Credential type 'postgres' not found
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such credential type.
        "500":
          content:
            application/problem+json:
              examples:
                error:
                  value:
                    detail: Internal server error
                    error: Internal server error
                    instance: /api/v1/credentials
                    status: 500
                    title: Internal Server Error
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The database or the encryption failed, or an unexpected error\
            \ occurred."
      summary: List the versions of one credential type
      tags:
      - Credential types
  /api/v1/credential-types/{type}/{version}:
    get:
      description: "Returns one type version with its schema and UI schema. Not user-scoped:\
        \ every caller sees the same types. Read-only."
      operationId: getCredentialTypeVersion
      parameters:
      - description: Credential type.
        example: GENERIC
        in: path
        name: type
        required: true
        schema:
          type: string
      - description: Type version.
        example: 1.0.0
        in: path
        name: version
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialType"
          description: The type version.
        "400":
          content:
            application/problem+json:
              examples:
                error:
                  value:
                    detail: Failed to read request
                    error: Failed to read request
                    instance: /api/v1/credentials
                    status: 400
                    title: Bad Request
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Malformed request: a missing or unparsable parameter, or a\
            \ body that is not valid JSON."
        "404":
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: Credential type 'postgres' not found
                instance: /api/v1/credential-types/postgres
                error: Credential type 'postgres' not found
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such type or version.
        "500":
          content:
            application/problem+json:
              examples:
                error:
                  value:
                    detail: Internal server error
                    error: Internal server error
                    instance: /api/v1/credentials
                    status: 500
                    title: Internal Server Error
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The database or the encryption failed, or an unexpected error\
            \ occurred."
      summary: Get one credential type version
      tags:
      - Credential types
  /api/v1/credentials:
    get:
      description: |2-

        Returns all of the caller's credentials **with decrypted `data`**. The workbench's credential picker reads `name` and
        `description` from it. Every returned credential's `lastAccessedAt` is set to now (one database update each).
      operationId: listCredentials
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Credential"
          description: The credentials; empty when the caller has none.
        "406":
          content:
            application/problem+json:
              examples:
                error:
                  value:
                    detail: "Acceptable representations: [application/json]."
                    error: "Acceptable representations: [application/json]."
                    instance: /api/v1/credentials
                    status: 406
                    title: Not Acceptable
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The `Accept` header asks for a media type this operation does
            not produce.
        "500":
          content:
            application/problem+json:
              examples:
                error:
                  value:
                    detail: Internal server error
                    error: Internal server error
                    instance: /api/v1/credentials
                    status: 500
                    title: Internal Server Error
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The database or the encryption failed, or an unexpected error\
            \ occurred."
      security:
      - continuumUserId: []
      summary: List the caller's credentials
      tags:
      - Credentials
    post:
      description: |2-

        Stores a new credential owned by the caller. `data` must satisfy the JSON Schema (draft 4) of the given credential type
        version; each value is encrypted with AES-GCM before it is stored. Used by the management UI. Not idempotent: a
        second create with the same name is a 409.
      operationId: createCredential
      requestBody:
        content:
          application/json:
            examples:
              generic:
                description: generic
                summary: AWS keys as a GENERIC credential
                value:
                  name: aws-prod
                  type: GENERIC
                  typeVersion: 1.0.0
                  description: Read-only access to the analytics bucket
                  data:
                    accessKeyId: AKIAIOSFODNN7EXAMPLE
                    secretAccessKey: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
                    region: us-east-2
            schema:
              $ref: "#/components/schemas/CredentialCreateRequest"
        description: The credential.
        required: true
      responses:
        "201":
          content:
            application/json:
              example:
                userId: alice
                name: aws-prod
                type: GENERIC
                typeVersion: 1.0.0
                description: Read-only access to the analytics bucket
                data:
                  accessKeyId: AKIAIOSFODNN7EXAMPLE
                  secretAccessKey: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
                  region: us-east-2
                createdBy: alice
                updatedBy: alice
                createdAt: 2026-11-21T09:00:00Z
                updatedAt: 2026-11-21T09:00:00Z
                lastAccessedAt: null
              schema:
                $ref: "#/components/schemas/Credential"
          description: Created. The response contains the decrypted `data`.
        "400":
          content:
            application/problem+json:
              examples:
                invalidField:
                  description: invalidField
                  value:
                    type: about:blank
                    title: Invalid request
                    status: 400
                    detail: "name: Name must contain only alphanumeric characters,\
                      \ hyphens, and underscores"
                    instance: /api/v1/credentials
                    error: "name: Name must contain only alphanumeric characters,\
                      \ hyphens, and underscores"
                    fieldErrors:
                    - field: name
                      message: "Name must contain only alphanumeric characters, hyphens,\
                        \ and underscores"
                schemaMismatch:
                  description: schemaMismatch
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: "Credential data does not match the schema: $.password:\
                      \ is missing but it is required"
                    instance: /api/v1/credentials
                    error: "Credential data does not match the schema: $.password:\
                      \ is missing but it is required"
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "A field is invalid (`fieldErrors` lists each one), `data`\
            \ does not match the type's schema, or the body is malformed."
        "404":
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: Credential type 'postgres' version '2.0.0' does not exist
                instance: /api/v1/credentials
                error: Credential type 'postgres' version '2.0.0' does not exist
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The credential type version does not exist.
        "409":
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Conflict
                status: 409
                detail: Credential 'aws-prod' already exists for user 'alice'
                instance: /api/v1/credentials
                error: Credential 'aws-prod' already exists for user 'alice'
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The caller already has a credential with this name.
        "500":
          content:
            application/problem+json:
              examples:
                error:
                  value:
                    detail: Internal server error
                    error: Internal server error
                    instance: /api/v1/credentials
                    status: 500
                    title: Internal Server Error
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The database or the encryption failed, or an unexpected error\
            \ occurred."
      security:
      - continuumUserId: []
      summary: Create a credential for the caller
      tags:
      - Credentials
  /api/v1/credentials/type/{type}:
    get:
      description: |2-

        Returns the caller's credentials of a credential type (any version), with decrypted `data`. The workbench's credential
        picker uses it when a node restricts the picker to a type. An unknown type is an empty list. Every returned credential's `lastAccessedAt` is set to now (one database update each).
      operationId: listCredentialsByType
      parameters:
      - description: Credential type.
        example: GENERIC
        in: path
        name: type
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Credential"
          description: The credentials; empty when none match.
        "400":
          content:
            application/problem+json:
              examples:
                error:
                  value:
                    detail: Failed to read request
                    error: Failed to read request
                    instance: /api/v1/credentials
                    status: 400
                    title: Bad Request
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Malformed request: a missing or unparsable parameter, or a\
            \ body that is not valid JSON."
        "500":
          content:
            application/problem+json:
              examples:
                error:
                  value:
                    detail: Internal server error
                    error: Internal server error
                    instance: /api/v1/credentials
                    status: 500
                    title: Internal Server Error
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The database or the encryption failed, or an unexpected error\
            \ occurred."
      security:
      - continuumUserId: []
      summary: List the caller's credentials of one type
      tags:
      - Credentials
  /api/v1/credentials/type/{type}/{version}:
    get:
      description: "Like `GET /api/v1/credentials/type/{type}`, restricted to one\
        \ type version. Every returned credential's `lastAccessedAt` is set to now\
        \ (one database update each)."
      operationId: listCredentialsByTypeVersion
      parameters:
      - description: Credential type.
        example: GENERIC
        in: path
        name: type
        required: true
        schema:
          type: string
      - description: Credential type version.
        example: 1.0.0
        in: path
        name: version
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Credential"
          description: The credentials; empty when none match.
        "400":
          content:
            application/problem+json:
              examples:
                error:
                  value:
                    detail: Failed to read request
                    error: Failed to read request
                    instance: /api/v1/credentials
                    status: 400
                    title: Bad Request
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Malformed request: a missing or unparsable parameter, or a\
            \ body that is not valid JSON."
        "500":
          content:
            application/problem+json:
              examples:
                error:
                  value:
                    detail: Internal server error
                    error: Internal server error
                    instance: /api/v1/credentials
                    status: 500
                    title: Internal Server Error
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The database or the encryption failed, or an unexpected error\
            \ occurred."
      security:
      - continuumUserId: []
      summary: List the caller's credentials of one type version
      tags:
      - Credentials
  /api/v1/credentials/{name}:
    delete:
      description: Deletes one of the caller's credentials. Nodes that reference it
        fail on their next run. A second delete is a 404.
      operationId: deleteCredential
      parameters:
      - description: "Credential name, unique per user: 1-255 characters of `[a-zA-Z0-9_-]`."
        example: aws-prod
        in: path
        name: name
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Deleted.
        "400":
          content:
            application/problem+json:
              examples:
                error:
                  value:
                    detail: Failed to read request
                    error: Failed to read request
                    instance: /api/v1/credentials
                    status: 400
                    title: Bad Request
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Malformed request: a missing or unparsable parameter, or a\
            \ body that is not valid JSON."
        "404":
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: Credential 'aws-prod' not found for user 'alice'
                instance: /api/v1/credentials/aws-prod
                error: Credential 'aws-prod' not found for user 'alice'
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The caller has no credential with this name.
        "500":
          content:
            application/problem+json:
              examples:
                error:
                  value:
                    detail: Internal server error
                    error: Internal server error
                    instance: /api/v1/credentials
                    status: 500
                    title: Internal Server Error
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The database or the encryption failed, or an unexpected error\
            \ occurred."
      security:
      - continuumUserId: []
      summary: Delete a credential
      tags:
      - Credentials
    get:
      description: |2-

        Returns one credential with decrypted `data`. This is how a node gets its secret at run time: the feature worker calls
        it from the node's `execute()` with the workflow owner as `x-continuum-user-id` and reads `data`. Every returned credential's `lastAccessedAt` is set to now (one database update each).
      operationId: getCredential
      parameters:
      - description: "Credential name, unique per user: 1-255 characters of `[a-zA-Z0-9_-]`."
        example: aws-prod
        in: path
        name: name
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
                userId: alice
                name: aws-prod
                type: GENERIC
                typeVersion: 1.0.0
                description: Read-only access to the analytics bucket
                data:
                  accessKeyId: AKIAIOSFODNN7EXAMPLE
                  secretAccessKey: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
                  region: us-east-2
                createdBy: alice
                updatedBy: alice
                createdAt: 2026-11-21T09:00:00Z
                updatedAt: 2026-11-21T09:00:00Z
                lastAccessedAt: null
              schema:
                $ref: "#/components/schemas/Credential"
          description: The credential.
        "400":
          content:
            application/problem+json:
              examples:
                error:
                  value:
                    detail: Failed to read request
                    error: Failed to read request
                    instance: /api/v1/credentials
                    status: 400
                    title: Bad Request
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Malformed request: a missing or unparsable parameter, or a\
            \ body that is not valid JSON."
        "404":
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: Credential 'aws-prod' not found for user 'alice'
                instance: /api/v1/credentials/aws-prod
                error: Credential 'aws-prod' not found for user 'alice'
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The caller has no credential with this name (other users' credentials
            are indistinguishable from unknown ones).
        "500":
          content:
            application/problem+json:
              examples:
                error:
                  value:
                    detail: Internal server error
                    error: Internal server error
                    instance: /api/v1/credentials
                    status: 500
                    title: Internal Server Error
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The database or the encryption failed, or an unexpected error\
            \ occurred."
      security:
      - continuumUserId: []
      summary: Get one of the caller's credentials with its decrypted values
      tags:
      - Credentials
    put:
      description: |2-

        Changes the given fields of one of the caller's credentials; omitted fields keep their value. `name` renames it (nodes
        that reference the old name then fail), `data` replaces all values and is checked against the (possibly new) type's
        schema. A null `description` keeps the current one. Idempotent for the same body.
      operationId: updateCredential
      parameters:
      - description: "Credential name, unique per user: 1-255 characters of `[a-zA-Z0-9_-]`."
        example: aws-prod
        in: path
        name: name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              rotate:
                description: rotate
                summary: Rotate the keys
                value:
                  description: Rotated on 2026-11-21
                  data:
                    accessKeyId: AKIAI44QH8DHBEXAMPLE
                    secretAccessKey: je7MtGbClwBF/2Zp9Utk/h3yCo8nvbEXAMPLEKEY
                    region: us-east-2
            schema:
              $ref: "#/components/schemas/CredentialUpdateRequest"
        description: The fields to change.
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
          description: Updated.
        "400":
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Bad Request
                status: 400
                detail: "Credential data does not match the schema: $.password: is\
                  \ missing but it is required"
                instance: /api/v1/credentials
                error: "Credential data does not match the schema: $.password: is\
                  \ missing but it is required"
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "A field is invalid, `data` does not match the type's schema,\
            \ or the body is malformed."
        "404":
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: Credential 'aws-prod' not found for user 'alice'
                instance: /api/v1/credentials/aws-prod
                error: Credential 'aws-prod' not found for user 'alice'
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The caller has no credential with this name, or the new type\
            \ version does not exist."
        "409":
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Conflict
                status: 409
                detail: Credential 'aws-prod' already exists for user 'alice'
                instance: /api/v1/credentials
                error: Credential 'aws-prod' already exists for user 'alice'
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The new name is already used, or the credential was changed\
            \ concurrently (retry)."
        "500":
          content:
            application/problem+json:
              examples:
                error:
                  value:
                    detail: Internal server error
                    error: Internal server error
                    instance: /api/v1/credentials
                    status: 500
                    title: Internal Server Error
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The database or the encryption failed, or an unexpected error\
            \ occurred."
      security:
      - continuumUserId: []
      summary: Update a credential
      tags:
      - Credentials
components:
  schemas:
    Credential:
      type: object
      description: "A credential of the caller, with its values decrypted."
      properties:
        createdAt:
          type: string
          format: date-time
          description: "When it was created (ISO-8601, UTC)."
          example: 2026-11-21T09:00:00Z
        createdBy:
          type: string
          description: User who created it.
          example: alice
        data:
          type: object
          additionalProperties:
            type: string
          description: "The secret values, decrypted: key → value."
          example:
            accessKeyId: AKIAIOSFODNN7EXAMPLE
            secretAccessKey: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
        description:
          type:
          - string
          - "null"
          description: Free-text description.
          example: Read-only access to the analytics bucket
        lastAccessedAt:
          type:
          - string
          - "null"
          format: date-time
          description: "When it was last returned by a read (ISO-8601, UTC); null\
            \ if never read since creation."
          example: 2026-11-21T10:12:00Z
        name:
          type: string
          description: "Name, unique per user."
          example: aws-prod
        type:
          type: string
          description: Credential type.
          example: GENERIC
        typeVersion:
          type: string
          description: Credential type version.
          example: 1.0.0
        updatedAt:
          type: string
          format: date-time
          description: "When it was last changed (ISO-8601, UTC)."
          example: 2026-11-21T09:00:00Z
        updatedBy:
          type: string
          description: User who last changed it.
          example: alice
        userId:
          type: string
          description: Owner (the `x-continuum-user-id` it was created with).
          example: alice
      required:
      - createdAt
      - createdBy
      - data
      - name
      - type
      - typeVersion
      - updatedAt
      - updatedBy
      - userId
    CredentialCreateRequest:
      type: object
      description: A new credential for the caller.
      properties:
        data:
          type: object
          additionalProperties:
            type: string
          description: "The secret values: key → string value. Must not be empty and\
            \ must satisfy the type's schema. Each value is encrypted at rest."
          example:
            accessKeyId: AKIAIOSFODNN7EXAMPLE
            secretAccessKey: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          minProperties: 1
        description:
          type:
          - string
          - "null"
          description: "Free-text description, at most 1000 characters."
          example: Read-only access to the analytics bucket
          maxLength: 1000
          minLength: 0
        name:
          type: string
          description: "Name, unique per user. Nodes reference the credential by this\
            \ name."
          example: aws-prod
          maxLength: 255
          minLength: 0
          pattern: "^[a-zA-Z0-9_-]+$"
        type:
          type: string
          description: Credential type; must exist (see `GET /api/v1/credential-types`).
          example: GENERIC
          maxLength: 50
          minLength: 0
        typeVersion:
          type: string
          description: Version of the credential type.
          example: 1.0.0
          maxLength: 50
          minLength: 0
      required:
      - data
      - name
      - type
      - typeVersion
    CredentialType:
      type: object
      description: One version of a credential type.
      properties:
        createdAt:
          type: string
          format: date-time
          description: "When it was registered (ISO-8601, UTC)."
          example: 2026-11-01T00:00:00Z
        schema:
          type: object
          additionalProperties: {}
          description: JSON Schema (draft 4) credential `data` of this type must satisfy.
          example:
            type: object
            additionalProperties:
              type: string
        type:
          type: string
          description: Type name.
          example: GENERIC
        uiSchema:
          type: object
          additionalProperties: {}
          description: "JSONForms UI schema of the credential form; `{}` when none."
        updatedAt:
          type: string
          format: date-time
          description: Same as `createdAt` (types are immutable).
          example: 2026-11-01T00:00:00Z
        version:
          type: string
          description: Version.
          example: 1.0.0
      required:
      - createdAt
      - schema
      - type
      - uiSchema
      - updatedAt
      - version
    CredentialTypeCreateRequest:
      type: object
      description: A new version of a credential type.
      properties:
        schema:
          type: object
          additionalProperties: {}
          default: {}
          description: "JSON Schema (draft 4) of a credential's `data` map. `{}` accepts\
            \ any values."
        type:
          type: string
          description: "Type name: 1-50 characters of `[a-zA-Z0-9_-]`."
          example: postgres
          maxLength: 50
          minLength: 0
          pattern: "^[a-zA-Z0-9_-]+$"
        uiSchema:
          type: object
          additionalProperties: {}
          default: {}
          description: JSONForms UI schema the management UI renders the credential
            form from.
        version:
          type: string
          default: 1.0.0
          description: "Version, at most 50 characters."
          example: 1.0.0
          maxLength: 50
          minLength: 0
      required:
      - type
    CredentialUpdateRequest:
      type: object
      description: Changes to a credential; omitted or null fields keep their value.
      properties:
        data:
          type:
          - object
          - "null"
          additionalProperties:
            type: string
          description: New values; replaces all current values and must satisfy the
            type's schema.
        description:
          type:
          - string
          - "null"
          description: New description. Null keeps the current one (it cannot be cleared).
          example: Rotated on 2026-11-21
          maxLength: 1000
          minLength: 0
        name:
          type:
          - string
          - "null"
          description: New name (renames the credential; must be free for this user).
          example: aws-prod-2026
          maxLength: 255
          minLength: 0
          pattern: "^[a-zA-Z0-9_-]+$"
        type:
          type:
          - string
          - "null"
          description: New credential type.
          example: GENERIC
          maxLength: 50
          minLength: 0
        typeVersion:
          type:
          - string
          - "null"
          description: New credential type version.
          example: 1.0.0
          maxLength: 50
          minLength: 0
    ProblemDetail:
      type: object
      description: "RFC 9457 problem detail, the error body of every Continuum service\
        \ (`application/problem+json`)."
      properties:
        detail:
          type: string
          description: Human-readable explanation of this occurrence.
          example: Credential 'aws-prod' not found
        error:
          type: string
          deprecated: true
          description: "Deprecated: the same text as `detail`, for clients of the\
            \ former `{\"error\": \"...\"}` bodies."
          example: Credential 'aws-prod' not found
        fieldErrors:
          type: array
          description: "Only on 400 for an invalid request body: one entry per violated\
            \ constraint."
          items:
            type: object
            properties:
              field:
                type: string
                description: Request field that failed validation.
                example: name
              message:
                type: string
                description: What is wrong with it.
                example: Name is required
            required:
            - field
            - message
        instance:
          type: string
          format: uri-reference
          description: Path of the request that produced the problem.
          example: /api/v1/credentials/aws-prod
        status:
          type: integer
          format: int32
          description: HTTP status code of this response.
          example: 404
        title:
          type: string
          description: Short summary of the problem type (the HTTP reason phrase by
            default).
          example: Not Found
        type:
          type: string
          format: uri-reference
          description: URI identifying the problem type; `about:blank` when only the
            status code matters.
          example: about:blank
      required:
      - detail
      - error
      - status
      - title
      - type
  securitySchemes:
    continuumUserId:
      description: "Owner of the credentials. Continuum has no built-in authentication:\
        \ this header is set by the trusted reverse proxy in front of the service\
        \ from the authenticated user (feature workers send the workflow owner's id),\
        \ and the proxy must strip any value sent by the client. Without it the caller\
        \ is `anonymous` (local development only)."
      in: header
      name: x-continuum-user-id
      type: apiKey
